<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORION / Worlds — A 3D Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <!-- Three.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #04050d;
      --fog: #080a1a;
      --text: #eef0ff;
      --muted: #8d91ae;
      --g1: #6af0ff;  /* cyan */
      --g2: #b56bff;  /* violet */
      --g3: #ff5fa7;  /* pink */
      --g4: #ffe16b;  /* warm */
    }

    html, body {
      height: 100%; overflow: hidden;
      background: var(--ink); color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #world-canvas {
      position: fixed; inset: 0;
      z-index: 1;
      display: block;
      cursor: grab;
    }
    #world-canvas:active { cursor: grabbing; }

    /* ───────── Hidden scroll driver ───────── */
    /* This invisible element provides scroll distance; we map scroll% to camera path */
    #scroll-driver {
      position: absolute; top: 0; left: 0;
      width: 1px; height: 600vh; /* 6 "stations" worth of scroll */
      pointer-events: none;
    }
    #scroll-wrap {
      position: fixed; inset: 0;
      overflow-y: scroll;
      overflow-x: hidden;
      z-index: 2;
      scrollbar-width: none;
    }
    #scroll-wrap::-webkit-scrollbar { display: none; }

    /* ───────── Loader ───────── */
    #loader {
      position: fixed; inset: 0; z-index: 50;
      background: var(--ink);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity .7s ease, visibility .7s;
    }
    #loader.done { opacity: 0; visibility: hidden; }
    .loader-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem; font-weight: 700; letter-spacing: 6px;
      background: linear-gradient(135deg, var(--g1), var(--g2), var(--g3));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 2rem;
    }
    .loader-bar {
      width: 240px; height: 2px; background: rgba(255,255,255,.07);
      border-radius: 100px; overflow: hidden;
    }
    .loader-bar > i {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3));
      transition: width .3s ease;
    }
    .loader-sub {
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted); font-size: .7rem;
      letter-spacing: 3px; text-transform: uppercase;
      margin-top: 1rem;
    }

    /* ───────── Overlay UI ───────── */
    .ui {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .ui > * { pointer-events: auto; }

    /* Top bar */
    .topbar {
      position: absolute; top: 1.6rem; left: 0; right: 0;
      display: flex; justify-content: space-between;
      padding: 0 2rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: .7rem;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted);
    }
    .brand {
      font-family: 'Space Grotesk', sans-serif;
      font-size: .9rem; font-weight: 700; letter-spacing: 3px;
      background: linear-gradient(135deg, var(--g1), var(--g2), var(--g3));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .loc { color: var(--muted); }
    .loc span.dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: #2fff62; margin-right: .5rem; vertical-align: middle;
      box-shadow: 0 0 10px #2fff62;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .4; } }

    /* Station navigation (right side dots) */
    .station-nav {
      position: absolute; right: 1.8rem; top: 50%;
      transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 1.2rem;
    }
    .station-dot {
      width: 14px; height: 14px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.25);
      cursor: pointer; background: transparent;
      transition: all .25s;
      position: relative;
    }
    .station-dot.active {
      background: linear-gradient(135deg, var(--g1), var(--g2));
      border-color: transparent;
      box-shadow: 0 0 14px rgba(181,107,255,.6);
    }
    .station-dot:hover { border-color: var(--g1); }
    .station-dot::after {
      content: attr(data-label);
      position: absolute; right: 24px; top: 50%;
      transform: translateY(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: .65rem; letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted);
      background: rgba(8,10,26,.85);
      backdrop-filter: blur(8px);
      padding: .25rem .7rem;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .station-dot:hover::after { opacity: 1; }

    /* Bottom progress */
    .progress {
      position: absolute; bottom: 1.6rem; left: 2rem; right: 2rem;
      display: flex; align-items: center; gap: 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: .65rem; letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted);
    }
    .progress .bar {
      flex: 1; height: 2px;
      background: rgba(255,255,255,.08);
      border-radius: 100px; overflow: hidden;
    }
    .progress .bar > i {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3));
      transition: width .1s;
    }
    .progress .cur { color: var(--text); }

    /* Scroll hint (shown only at start) */
    .scroll-hint {
      position: absolute; bottom: 5rem; left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: .8rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: .65rem; letter-spacing: 3px; text-transform: uppercase;
      color: var(--muted);
      transition: opacity .4s;
    }
    .scroll-hint.hidden { opacity: 0; pointer-events: none; }
    .scroll-hint .mouse {
      width: 22px; height: 34px;
      border: 1.5px solid var(--muted);
      border-radius: 14px; position: relative;
    }
    .scroll-hint .mouse::after {
      content: '';
      position: absolute;
      top: 6px; left: 50%; transform: translateX(-50%);
      width: 2px; height: 6px;
      background: var(--g1);
      border-radius: 2px;
      animation: scroll 1.8s ease-in-out infinite;
    }
    @keyframes scroll {
      0%, 100% { transform: translate(-50%, 0); opacity: 1; }
      70% { transform: translate(-50%, 14px); opacity: 0; }
    }

    /* Contact panel (shown on last station) */
    .contact-panel {
      position: absolute; bottom: 6rem; left: 50%;
      transform: translate(-50%, 40px);
      width: min(480px, 92vw);
      padding: 1.8rem;
      border-radius: 20px;
      background: rgba(8,10,26,.7);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 30px 80px rgba(0,0,0,.5);
      opacity: 0; visibility: hidden;
      transition: opacity .5s, transform .5s, visibility .5s;
    }
    .contact-panel.visible {
      opacity: 1; visibility: visible;
      transform: translate(-50%, 0);
    }
    .contact-panel h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4rem; font-weight: 700;
      margin-bottom: 1.2rem;
      letter-spacing: -.5px;
    }
    .contact-panel h3 em {
      font-style: italic; font-weight: 400; color: var(--g1);
    }
    .form-row { display: grid; gap: .4rem; margin-bottom: .9rem; }
    .form-row label {
      font-family: 'JetBrains Mono', monospace;
      font-size: .62rem; letter-spacing: 2px;
      text-transform: uppercase; color: var(--muted);
    }
    .form-row input, .form-row textarea {
      font-family: inherit; font-size: .9rem; color: var(--text);
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      padding: .7rem .9rem;
      border-radius: 10px; outline: none;
      transition: border-color .2s;
      resize: vertical;
    }
    .form-row input:focus, .form-row textarea:focus {
      border-color: var(--g1);
    }
    .send-btn {
      width: 100%; margin-top: .3rem;
      padding: .85rem 1rem;
      border: none; cursor: pointer;
      border-radius: 100px;
      background: linear-gradient(135deg, var(--g1), var(--g2));
      color: var(--ink);
      font-family: inherit; font-size: .9rem; font-weight: 700;
      letter-spacing: .5px;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 10px 30px rgba(181,107,255,.4);
    }
    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 40px rgba(181,107,255,.6);
    }
    .send-btn:disabled { opacity: .6; cursor: wait; }

    /* Corner signature */
    .signature {
      position: absolute; bottom: 4.6rem; right: 1.8rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: .65rem; letter-spacing: 3px; text-transform: uppercase;
      color: transparent;
      background: linear-gradient(135deg, var(--g1), var(--g2), var(--g3));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    /* Mobile */
    @media (max-width: 700px) {
      .topbar { font-size: .58rem; padding: 0 1.2rem; }
      .station-nav { right: 1rem; gap: .8rem; }
      .station-dot { width: 10px; height: 10px; }
      .progress { left: 1rem; right: 1rem; }
      .contact-panel { bottom: 5.2rem; padding: 1.3rem; }
    }
  </style>
</head>
<body>

<!-- Loader -->
<div id="loader">
  <div class="loader-title">ORION / WORLDS</div>
  <div class="loader-bar"><i id="loaderBar"></i></div>
  <div class="loader-sub" id="loaderSub">Assembling geometry...</div>
</div>

<!-- Scroll wrap (provides scrollbar even though canvas is fixed) -->
<div id="scroll-wrap">
  <div id="scroll-driver"></div>
</div>

<!-- Overlay UI -->
<div class="ui">
  <div class="topbar">
    <div class="brand">ORION · WORLDS</div>
    <div class="loc"><span class="dot"></span>Station <span id="curStation">01</span> / 06</div>
  </div>

  <div class="station-nav" id="stationNav">
    <button class="station-dot active" data-i="0" data-label="Intro"></button>
    <button class="station-dot"        data-i="1" data-label="About"></button>
    <button class="station-dot"        data-i="2" data-label="Skills"></button>
    <button class="station-dot"        data-i="3" data-label="Work"></button>
    <button class="station-dot"        data-i="4" data-label="Process"></button>
    <button class="station-dot"        data-i="5" data-label="Contact"></button>
  </div>

  <div class="scroll-hint" id="scrollHint">
    <div class="mouse"></div>
    <span>Scroll to fly</span>
  </div>

  <div class="progress">
    <span class="cur" id="stationName">INTRO · ORIGIN</span>
    <div class="bar"><i id="progressBar"></i></div>
    <span id="progressPct">0%</span>
  </div>

  <form class="contact-panel" id="contactPanel" onsubmit="handleSubmit(event)">
    <h3>Let's build <em>together.</em></h3>
    <div class="form-row">
      <label>Your name</label>
      <input type="text" required placeholder="Ada Lovelace" />
    </div>
    <div class="form-row">
      <label>Email</label>
      <input type="email" required placeholder="you@studio.com" />
    </div>
    <div class="form-row">
      <label>Project</label>
      <textarea rows="2" required placeholder="What are we building?"></textarea>
    </div>
    <button type="submit" class="send-btn" id="sendBtn">Send transmission →</button>
  </form>

  <div class="signature">★ MADE BY NOUR ★</div>
</div>

<!-- Three.js canvas is injected by JS -->

<script>
/* ═══════════════════════════════════════════════════════════════════
   ORION / WORLDS — Fully 3D portfolio (Three.js)
   All sections are rendered as 3D geometry. Scroll flies the camera
   along a curved path through 6 "stations" in space.
═══════════════════════════════════════════════════════════════════ */

const WORLD_COLORS = {
  bg: 0x04050d,
  fog: 0x060818,
  cyan: 0x6af0ff,
  violet: 0xb56bff,
  pink: 0xff5fa7,
  warm: 0xffe16b,
  white: 0xffffff,
  lilac: 0xc9c8ff
};

/* ── Scene, camera, renderer ── */
const scene = new THREE.Scene();
scene.background = new THREE.Color(WORLD_COLORS.bg);
scene.fog = new THREE.Fog(WORLD_COLORS.fog, 30, 180);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 500);
camera.position.set(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.domElement.id = 'world-canvas';
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

/* ── Lights ── */
scene.add(new THREE.AmbientLight(0x4a4a80, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 0.7);
key.position.set(5, 8, 5);
scene.add(key);
const rim1 = new THREE.PointLight(WORLD_COLORS.violet, 1.4, 80);
rim1.position.set(-6, 4, -5);
scene.add(rim1);
const rim2 = new THREE.PointLight(WORLD_COLORS.cyan, 1.2, 80);
rim2.position.set(6, -3, -12);
scene.add(rim2);

/* ═══════════════════════════════════════════════════════════════════
   Canvas texture helper — draws text/layout onto a canvas and wraps
   it into a Three.js texture for use as a material map.
═══════════════════════════════════════════════════════════════════ */
function makeTexture(draw, w = 1024, h = 512) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  draw(ctx, w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.needsUpdate = true;
  return tex;
}

function textPlane(drawFn, w = 1024, h = 512, planeW = 10, planeH = 5) {
  const tex = makeTexture(drawFn, w, h);
  const geo = new THREE.PlaneGeometry(planeW, planeH);
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
  return new THREE.Mesh(geo, mat);
}

/* ═══════════════════════════════════════════════════════════════════
   STARFIELD BACKGROUND
═══════════════════════════════════════════════════════════════════ */
(function addStars(){
  const geo = new THREE.BufferGeometry();
  const pos = [];
  const col = [];
  const palette = [
    new THREE.Color(0xffffff),
    new THREE.Color(WORLD_COLORS.cyan),
    new THREE.Color(WORLD_COLORS.violet),
    new THREE.Color(WORLD_COLORS.warm)
  ];
  for (let i = 0; i < 2500; i++) {
    const r = 80 + Math.random() * 120;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(Math.random() * 2 - 1);
    pos.push(
      r * Math.sin(phi) * Math.cos(theta),
      r * Math.sin(phi) * Math.sin(theta),
      r * Math.cos(phi) - 90   // offset back along z
    );
    const c = palette[Math.floor(Math.random()*palette.length)];
    col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.6, vertexColors: true,
    transparent: true, opacity: 0.8,
    sizeAttenuation: true
  });
  scene.add(new THREE.Points(geo, mat));
})();

/* Floating dust particles near camera path */
(function addDust(){
  const geo = new THREE.BufferGeometry();
  const pos = [];
  for (let i = 0; i < 600; i++) {
    pos.push(
      (Math.random()-0.5)*40,
      (Math.random()-0.5)*30,
      -Math.random()*250
    );
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: 0xc9c8ff, size: 0.06,
    transparent: true, opacity: 0.4
  });
  scene.add(new THREE.Points(geo, mat));
})();

/* ═══════════════════════════════════════════════════════════════════
   STATION 01 — HERO / INTRO  (z ≈ 0)
═══════════════════════════════════════════════════════════════════ */
const station1 = new THREE.Group();
station1.position.set(0, 0, -5);

// Central glowing orb
const orbGeo = new THREE.IcosahedronGeometry(1.8, 1);
const orbMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  emissive: WORLD_COLORS.violet,
  emissiveIntensity: 1.1,
  roughness: 0.2, metalness: 0.3,
  wireframe: false
});
const orb = new THREE.Mesh(orbGeo, orbMat);
station1.add(orb);

// Wireframe shell around orb
const shellGeo = new THREE.IcosahedronGeometry(2.6, 1);
const shellMat = new THREE.MeshBasicMaterial({
  color: WORLD_COLORS.cyan, wireframe: true, transparent: true, opacity: 0.4
});
const shell = new THREE.Mesh(shellGeo, shellMat);
station1.add(shell);

// Ring
const ringGeo = new THREE.TorusGeometry(4.2, 0.05, 16, 100);
const ringMat = new THREE.MeshBasicMaterial({ color: WORLD_COLORS.pink, transparent: true, opacity: .7 });
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = Math.PI / 2.3;
station1.add(ring);

// Title plane
const titlePlane = textPlane((ctx, w, h) => {
  ctx.clearRect(0,0,w,h);
  const g = ctx.createLinearGradient(0, 0, w, 0);
  g.addColorStop(0, '#6af0ff'); g.addColorStop(.5, '#b56bff'); g.addColorStop(1, '#ff5fa7');
  ctx.fillStyle = g;
  ctx.font = 'bold 180px "Space Grotesk", sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('ORION', 40, h*.4);
  ctx.fillStyle = '#c9c8ff';
  ctx.font = 'italic 72px "Space Grotesk", serif';
  ctx.fillText('a designer who codes', 48, h*.72);
  ctx.fillStyle = '#8d91ae';
  ctx.font = '500 36px "JetBrains Mono", monospace';
  ctx.fillText('// LISBON · 2026', 48, h*.88);
}, 1600, 800, 14, 7);
titlePlane.position.set(6, 0.5, 0);
station1.add(titlePlane);

// Floating subtitle badge
const badge = textPlane((ctx, w, h) => {
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = 'rgba(106,240,255,.08)';
  ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = '#6af0ff'; ctx.lineWidth = 6;
  ctx.strokeRect(0,0,w,h);
  ctx.fillStyle = '#6af0ff';
  ctx.font = 'bold 52px "JetBrains Mono", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('• INTERACTIVE 3D', w/2, h/2);
}, 1024, 180, 6, 1.05);
badge.position.set(-3, 3.2, 0);
badge.rotation.z = -.08;
station1.add(badge);

scene.add(station1);

/* ═══════════════════════════════════════════════════════════════════
   STATION 02 — ABOUT  (z ≈ -28)
═══════════════════════════════════════════════════════════════════ */
const station2 = new THREE.Group();
station2.position.set(0, 0, -28);

// Portrait card (canvas → plane on a slim box)
const portraitTex = makeTexture((ctx, w, h) => {
  // bg
  const bg = ctx.createLinearGradient(0, 0, w, h);
  bg.addColorStop(0, '#1a1040'); bg.addColorStop(1, '#3a1a6a');
  ctx.fillStyle = bg; ctx.fillRect(0,0,w,h);
  // stylized head
  ctx.fillStyle = '#ffd8a8';
  ctx.beginPath(); ctx.arc(w*.5, h*.42, 140, 0, Math.PI*2); ctx.fill();
  // hair
  ctx.fillStyle = '#2a1140';
  ctx.beginPath(); ctx.arc(w*.5, h*.35, 135, Math.PI, 2*Math.PI); ctx.fill();
  ctx.fillRect(w*.5 - 140, h*.35, 280, 60);
  // eyes
  ctx.fillStyle = '#6af0ff';
  ctx.beginPath(); ctx.arc(w*.44, h*.43, 8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(w*.56, h*.43, 8, 0, Math.PI*2); ctx.fill();
  // neck
  ctx.fillStyle = '#ecc198';
  ctx.fillRect(w*.42, h*.52, w*.16, h*.1);
  // torso (shirt)
  ctx.fillStyle = '#b56bff';
  ctx.beginPath();
  ctx.moveTo(w*.3, h);
  ctx.lineTo(w*.35, h*.62);
  ctx.lineTo(w*.42, h*.58);
  ctx.lineTo(w*.58, h*.58);
  ctx.lineTo(w*.65, h*.62);
  ctx.lineTo(w*.7, h);
  ctx.closePath(); ctx.fill();
  // label
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 64px "Space Grotesk", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('ORION REED', 40, 90);
  ctx.fillStyle = '#6af0ff';
  ctx.font = '500 40px "JetBrains Mono", monospace';
  ctx.fillText('> designer.engineer', 40, 140);
  // scanlines
  ctx.fillStyle = 'rgba(0,0,0,.1)';
  for (let y=0; y<h; y+=4) ctx.fillRect(0,y,w,2);
}, 512, 720);

const cardGroup = new THREE.Group();
const cardFront = new THREE.Mesh(
  new THREE.PlaneGeometry(4, 5.6),
  new THREE.MeshBasicMaterial({ map: portraitTex })
);
const cardBack = new THREE.Mesh(
  new THREE.BoxGeometry(4.2, 5.8, 0.1),
  new THREE.MeshStandardMaterial({ color: 0x1a1a3a, roughness: .4, metalness: .6 })
);
cardBack.position.z = -0.06;
cardGroup.add(cardBack, cardFront);
cardGroup.position.set(-4, 0, 0);
cardGroup.rotation.y = 0.25;
station2.add(cardGroup);

// Bio plane
const bio = textPlane((ctx, w, h) => {
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = '#6af0ff';
  ctx.font = '500 32px "JetBrains Mono", monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('// ABOUT', 0, 0);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 84px "Space Grotesk", sans-serif';
  ctx.fillText('I craft', 0, 60);
  const lg = ctx.createLinearGradient(0, 150, 600, 150);

const STATIONS = [
  { z: 5,     y: 0,    x: 0,    name: 'INTRO · ORIGIN' },
  { z: -23,   y: 0.3,  x: -1.2, name: 'ABOUT · SIGNAL' },
  { z: -55,   y: 1.0,  x: 1.4,  name: 'SKILLS · CONSTELLATION' },
  { z: -87,   y: 0.2,  x: 0,    name: 'WORK · GALLERY' },
  { z: -119,  y: 0.6,  x: -1.0, name: 'PROCESS · FOUR MOVES' },
  { z: -151,  y: 0.5,  x: 0,    name: 'CONTACT · TRANSMIT' }
];

let scrollProgress = 0; // 0 → 1 across whole path
let targetScroll = 0;
let currentStation = 0;

function updateScroll() {
  const wrap = document.getElementById('scroll-wrap');
  const maxScroll = wrap.scrollHeight - wrap.clientHeight;
  targetScroll = Math.max(0, Math.min(1, wrap.scrollTop / (maxScroll || 1)));
}

document.getElementById('scroll-wrap').addEventListener('scroll', () => {
  updateScroll();
  const sh = document.getElementById('scrollHint');
  if (targetScroll > 0.02) sh.classList.add('hidden');
  else sh.classList.remove('hidden');
});

/* Click station dots */
document.querySelectorAll('.station-dot').forEach(btn => {
  btn.addEventListener('click', () => {
    const i = parseInt(btn.dataset.i);
    const wrap = document.getElementById('scroll-wrap');
    const maxScroll = wrap.scrollHeight - wrap.clientHeight;
    const target = (i / (STATIONS.length - 1)) * maxScroll;
    wrap.scrollTo({ top: target, behavior: 'smooth' });
  });
});

function getCameraAtProgress(t) {
  // t ∈ [0,1] → interpolate between stations along the z-path
  const seg = t * (STATIONS.length - 1);
  const i = Math.min(STATIONS.length - 2, Math.floor(seg));
  const f = seg - i;
  // Smoothstep easing
  const e = f * f * (3 - 2 * f);
  const a = STATIONS[i], b = STATIONS[i+1];
  return {
    x: a.x + (b.x - a.x) * e,
    y: a.y + (b.y - a.y) * e,
    z: a.z + (b.z - a.z) * e,
    station: (f < 0.5 ? i : i+1)
  };
}

/* ═══════════════════════════════════════════════════════════════════
   MOUSE PARALLAX
═══════════════════════════════════════════════════════════════════ */
const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
window.addEventListener('mousemove', (e) => {
  mouse.tx = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.ty = -((e.clientY / window.innerHeight) * 2 - 1);
});

/* ═══════════════════════════════════════════════════════════════════
   RESIZE
═══════════════════════════════════════════════════════════════════ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ═══════════════════════════════════════════════════════════════════
   ANIMATION LOOP
═══════════════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();
let lastStation = -1;

function tick(){
  const dt = clock.getDelta();
  const time = clock.elapsedTime;

  // Lerp scroll progress for smoothness
  scrollProgress += (targetScroll - scrollProgress) * 0.08;

  // Camera along path
  const pos = getCameraAtProgress(scrollProgress);
  // Add mouse parallax
  mouse.x += (mouse.tx - mouse.x) * 0.05;
  mouse.y += (mouse.ty - mouse.y) * 0.05;
  camera.position.set(pos.x + mouse.x * 1.2, pos.y + mouse.y * 0.6, pos.z);
  // Look slightly forward (toward next station)
  const lookAhead = getCameraAtProgress(Math.min(1, scrollProgress + 0.02));
  camera.lookAt(lookAhead.x, lookAhead.y, lookAhead.z - 8);

  // Station 1 animations
  orb.rotation.y = time * 0.3;
  orb.rotation.x = time * 0.15;
  shell.rotation.y = -time * 0.2;
  shell.rotation.z = time * 0.1;
  ring.rotation.z = time * 0.25;

  // Station 2
  cardGroup.rotation.y = 0.25 + Math.sin(time * 0.5) * 0.1;
  cardGroup.position.y = Math.sin(time * 0.7) * 0.15;

  // Station 3 skill constellation
  skillMeshes.forEach((m, i) => {
    const base = m.userData.basePos;
    const offset = Math.sin(time * 0.6 + i) * 0.18;
    m.position.set(
      base.x + Math.cos(time * 0.3 + i) * 0.2,
      base.y + offset,
      base.z + Math.sin(time * 0.4 + i) * 0.15
    );
    const mesh = m.children[0];
    mesh.rotation.x += dt * m.userData.spin;
    mesh.rotation.y += dt * m.userData.spin * 0.8;
  });

  // Station 4 work frames float / bank
  workMeshes.forEach((m, i) => {
    m.position.y = Math.sin(time * 0.6 + i * 0.9) * 0.18;
    m.rotation.y = m.userData.baseRotY + Math.sin(time * 0.3 + i) * 0.07;
  });

  // Station 5 process nodes spin + pulse
  station5.children.forEach(c => {
    if (c.userData && c.userData.spin) {
      c.rotation.y += dt * c.userData.spin;
      if (c.userData.halo) {
        const s = 1 + Math.sin(time * 2 + c.position.x) * 0.1;
        c.userData.halo.scale.set(s, s, s);
      }
    }
  });

  // Station 6 big orb + gyro
  bigOrb.rotation.y = time * 0.2;
  bigOrb.rotation.x = time * 0.1;
  gyro.children.forEach(g => {
    g.rotation.x = g.userData.baseRotX + time * g.userData.spin;
    g.rotation.y = g.userData.baseRotY + time * g.userData.spin * 0.7;
  });

  // Update UI
  const station = pos.station;
  const pct = Math.round(scrollProgress * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('stationName').textContent = STATIONS[station].name;
  document.getElementById('curStation').textContent = String(station + 1).padStart(2, '0');

  if (station !== lastStation) {
    lastStation = station;
    document.querySelectorAll('.station-dot').forEach((d, i) => {
      d.classList.toggle('active', i === station);
    });
    // Show contact panel only on last station
    const panel = document.getElementById('contactPanel');
    if (station === STATIONS.length - 1) panel.classList.add('visible');
    else panel.classList.remove('visible');
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

/* ═══════════════════════════════════════════════════════════════════
   LOADER → START
═══════════════════════════════════════════════════════════════════ */
(function startUp(){
  // Fake progress while Three.js sets up
  const bar = document.getElementById('loaderBar');
  const sub = document.getElementById('loaderSub');
  const stages = [
    'Seeding particles...',
    'Building constellations...',
    'Forging materials...',
    'Calibrating camera...',
    'Entering orbit...'
  ];
  let p = 0, i = 0;
  const intv = setInterval(() => {
    p += 12 + Math.random() * 8;
    if (p >= 100) {
      p = 100;
      bar.style.width = '100%';
      sub.textContent = 'Welcome aboard.';
      clearInterval(intv);
      setTimeout(() => {
        document.getElementById('loader').classList.add('done');
        updateScroll();
        tick();
      }, 500);
    } else {
      bar.style.width = p + '%';
      sub.textContent = stages[Math.min(stages.length-1, i++)] || stages[stages.length-1];
    }
  }, 240);
})();

/* ═══════════════════════════════════════════════════════════════════
   CONTACT FORM
═══════════════════════════════════════════════════════════════════ */
function handleSubmit(e){
  e.preventDefault();
  const btn = document.getElementById('sendBtn');
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Transmitting...';
  setTimeout(() => {
    btn.textContent = '✓ Signal received';
    btn.style.background = 'linear-gradient(135deg, #2fff62, #6af0ff)';
    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = orig;
      btn.style.background = '';
      e.target.reset();
    }, 2500);
  }, 900);
}
