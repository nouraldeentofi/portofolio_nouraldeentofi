<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank of Nour — ATM · Withdraw Talent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bank:#0e2a4a;--bankd:#081a30;--metal:#7d8aa0;--metald:#4a5568;--scr:#0c1f14;--grn:#6fe89a;
        --fg:#e8eef8;--dim:rgba(232,238,248,.6);--gold:#e8c060}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'IBM Plex Mono',monospace;background:radial-gradient(80vw 60vh at 50% 0%,#1a3a5e,var(--bank) 55%,var(--bankd));
    color:var(--fg);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:4vh 4vw 8vh}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--gold);color:#0e2a4a}
  h1{font-family:'Oxanium',cursive;font-weight:700;font-size:clamp(20px,4vw,34px);letter-spacing:.08em}
  h1 span{color:var(--gold)}
  .sub{font-size:10px;letter-spacing:.3em;color:var(--dim);margin:8px 0 24px;text-transform:uppercase;text-align:center}

  #atm{width:min(520px,96vw);background:linear-gradient(180deg,#9aa5b8,var(--metal) 30%,var(--metald));
    border-radius:22px;padding:20px;box-shadow:0 40px 80px rgba(0,0,0,.55), inset 0 3px 0 rgba(255,255,255,.4)}
  #screenBezel{background:#22262e;border-radius:14px;padding:12px;box-shadow:inset 0 4px 12px rgba(0,0,0,.6)}
  #screen{background:var(--scr);border-radius:8px;min-height:250px;padding:18px 20px;color:var(--grn);
    text-shadow:0 0 8px rgba(111,232,154,.5);font-size:13px;line-height:1.8;position:relative;overflow:hidden}
  #screen::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0 1px,transparent 1px 3px)}
  #screen .head{display:flex;justify-content:space-between;font-size:10px;opacity:.75;border-bottom:1px solid rgba(111,232,154,.3);
    padding-bottom:6px;margin-bottom:10px;letter-spacing:.1em}
  #screen .big{font-family:'Oxanium';font-size:17px;letter-spacing:.06em}
  .opt{display:flex;justify-content:space-between;padding:5px 0;cursor:pointer}
  .opt:hover{color:#fff}
  .cursorG::after{content:'█';animation:bl 1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  #screen a{color:var(--grn);text-decoration:underline}

  /* keypad + slots */
  #lower{display:grid;grid-template-columns:1fr 130px;gap:14px;margin-top:16px}
  #keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .k{font-family:'Oxanium';font-size:16px;font-weight:700;border:none;border-radius:8px;padding:13px 0;cursor:pointer;
    background:linear-gradient(180deg,#e8ecf2,#b8c2d0);color:#22262e;box-shadow:0 4px 0 #6a7486;
    transition:transform .08s,box-shadow .08s}
  .k:active{transform:translateY(3px);box-shadow:0 1px 0 #6a7486}
  .k.ok{background:linear-gradient(180deg,#7de89a,#3d9e5c);color:#0c2a14;box-shadow:0 4px 0 #1d6e38}
  .k.cancel{background:linear-gradient(180deg,#ff8a7a,#c04535);color:#3a0e08;box-shadow:0 4px 0 #7a2418}
  #slots{display:flex;flex-direction:column;gap:12px}
  .slotLb{font-size:8.5px;letter-spacing:.2em;color:#2c313a;text-align:center;font-weight:600}
  #cardSlot{height:14px;background:#14171c;border-radius:4px;box-shadow:inset 0 2px 6px #000, 0 0 12px rgba(232,192,96,.0);
    transition:box-shadow .3s;position:relative;overflow:visible}
  #cardSlot.glow{box-shadow:inset 0 2px 6px #000, 0 0 16px rgba(232,192,96,.8)}
  #card{position:absolute;left:50%;top:-44px;transform:translateX(-50%);width:84px;height:52px;border-radius:6px;
    background:linear-gradient(135deg,#e8c060,#b3872e);cursor:pointer;transition:top .6s,opacity .4s;
    box-shadow:0 6px 14px rgba(0,0,0,.4);display:flex;flex-direction:column;justify-content:space-between;padding:6px}
  #card .chip{width:16px;height:12px;background:#f5e6b8;border-radius:3px}
  #card .cno{font-size:6.5px;color:#3a2a08;letter-spacing:.08em;font-weight:600}
  #cashSlot{height:34px;background:#14171c;border-radius:6px;box-shadow:inset 0 3px 8px #000;overflow:hidden;position:relative}
  #bill{position:absolute;left:50%;transform:translateX(-50%);top:100%;width:86%;height:26px;border-radius:3px;
    background:linear-gradient(90deg,#7de89a,#3d9e5c);display:flex;align-items:center;justify-content:center;
    font-size:8px;color:#0c2a14;font-weight:700;letter-spacing:.1em;transition:top .8s}
  #receiptSlot{height:10px;background:#14171c;border-radius:3px;box-shadow:inset 0 2px 5px #000}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<h1>🏧 BANK OF <span>NOUR</span></h1>
<div class="sub">Talent teller machine · no fees · insert card to begin · أدخل بطاقتك</div>

<div id="atm">
  <div id="screenBezel"><div id="screen">
    <div class="head"><span>BANK OF NOUR · RIYADH</span><span id="scrTime"></span></div>
    <div id="scrBody"><div class="big">WELCOME</div><br>Please insert your card ↓<br><span class="cursorG"></span></div>
  </div></div>
  <div id="lower">
    <div id="keys"></div>
    <div id="slots">
      <div><div class="slotLb">CARD</div><div id="cardSlot"><div id="card"><div class="chip"></div><div class="cno">CLIENT •••• 2026</div></div></div></div>
      <div><div class="slotLb">CASH / TALENT</div><div id="cashSlot"><div id="bill">NOUR-NOTE · UNLIMITED VALUE</div></div></div>
      <div><div class="slotLb">RECEIPT</div><div id="receiptSlot"></div></div>
    </div>
  </div>
</div>

<script>
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
setInterval(()=>{document.getElementById('scrTime').textContent=new Date().toLocaleTimeString('en-GB');},1000);
let AC=null;
function beep(f,t){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f||880;
  g.gain.setValueAtTime(.045,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+(t||.09));
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(t||.11));}catch(e){}}
function whir(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=110;
  g.gain.setValueAtTime(.05,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.7);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.75);}catch(e){}}

const scr=document.getElementById('scrBody');
let state='idle',pin='';

/* keypad */
const keys=document.getElementById('keys');
['1','2','3','4','5','6','7','8','9','CANCEL','0','OK'].forEach(k=>{
  const b=document.createElement('button');
  b.className='k'+(k==='OK'?' ok':k==='CANCEL'?' cancel':'');
  b.textContent=k;
  b.onclick=()=>press(k);
  keys.appendChild(b);
});
/* card insert */
document.getElementById('card').onclick=()=>{
  if(state!=='idle')return;
  beep(660);whir();
  document.getElementById('card').style.top='6px';
  document.getElementById('card').style.opacity='0';
  document.getElementById('cardSlot').classList.add('glow');
  setTimeout(()=>{state='pin';pin='';
    scr.innerHTML=`<div class="big">CARD ACCEPTED ✓</div><br>Enter any PIN (we trust you):<br><div id="pinDots" style="font-size:22px;letter-spacing:8px;margin-top:6px">____</div>`;
  },reduced?100:700);
};
function press(k){
  beep(k==='OK'?990:k==='CANCEL'?330:770);
  if(state==='pin'){
    if(k==='CANCEL'){pin='';renderPin();return;}
    if(k==='OK'||pin.length>=4){menu();return;}
    if(/\d/.test(k)){pin+=k;renderPin();if(pin.length===4)setTimeout(menu,300);}
  }else if(state==='menu'){
    if(k==='1')balance();
    else if(k==='2')statement();
    else if(k==='3')withdraw();
    else if(k==='4')contactScr();
    else if(k==='CANCEL')menu();
  }else if(state!=='idle'&&k==='CANCEL'){menu();}
  else if(state!=='idle'&&k==='OK'){menu();}
}
function renderPin(){const d=document.getElementById('pinDots');
  if(d)d.textContent=('•'.repeat(pin.length)+'____').slice(0,4);}
function menu(){
  state='menu';
  scr.innerHTML=`<div class="big">MAIN MENU — ACCOUNT: N.A. TOFI</div><br>
    <div class="opt" onclick="press('1')"><span>1 · SKILL BALANCE</span><span>→</span></div>
    <div class="opt" onclick="press('2')"><span>2 · CAREER STATEMENT</span><span>→</span></div>
    <div class="opt" onclick="press('3')"><span>3 · WITHDRAW TALENT</span><span>→</span></div>
    <div class="opt" onclick="press('4')"><span>4 · TRANSFER (CONTACT)</span><span>→</span></div>`;
}
window.press=press;
function balance(){
  state='sub';
  scr.innerHTML=`<div class="big">SKILL BALANCE</div><br>
    REACT ............ UNLIMITED<br>
    TYPESCRIPT ....... UNLIMITED<br>
    TAILWIND CSS ..... UNLIMITED<br>
    JAVASCRIPT ....... UNLIMITED<br>
    PYTHON DS/AI ..... HEALTHY<br>
    COORDINATION ..... PROVEN (GOLDENTAG)<br>
    CLEAN CODE ....... COMPOUNDING DAILY<br><br>
    <span style="opacity:.7">CERTS ON DEPOSIT: META · GOOGLE ×2 · IBM ×2 · +5<br>PRESS CANCEL FOR MENU</span>`;
}
function statement(){
  state='sub';
  scr.innerHTML=`<div class="big">CAREER STATEMENT — LAST 7 YEARS</div><br>
    2019-24  KALAMOON UNIV (B.TECH IT) .. +DEGREE<br>
    2021     ICPC/ACPC ................. +REFLEXES<br>
    2023-24  MINICODELEADER ............ +REACT<br>
    2024-25  KHWARIZM TECH, RIYADH ..... +PROD EXP<br>
    2025→    NEXLEAD (FREELANCE) ....... +GOLDENTAG<br>
    2025     DISTINCTIVE FRONTIER ...... +DUAL ROLE<br>
    2026→    SUPERVISOR PROMOTION ...... +LEADERSHIP<br><br>
    <span style="opacity:.7">NO OVERDRAFTS. PRESS CANCEL FOR MENU</span>`;
}
function withdraw(){
  state='sub';whir();
  scr.innerHTML=`<div class="big">DISPENSING TALENT…</div><br>Please take your developer below ↓<br><br>
    ONE (1) NOUR-NOTE:<br>websites · React frontends · logos<br>business cards · social visuals · coordination`;
  const bill=document.getElementById('bill');
  bill.style.top='100%';
  setTimeout(()=>{bill.style.top='4px';beep(1100,.2);},reduced?50:400);
  setTimeout(()=>{
    scr.innerHTML+=`<br><span style="opacity:.7">RECEIPT? PRESS 4 TO TRANSFER-CONTACT · CANCEL FOR MENU</span>`;
  },reduced?100:1300);
}
function contactScr(){
  state='sub';beep(880,.15);
  scr.innerHTML=`<div class="big">TRANSFER TO: NOUR ALDEEN TOFI</div><br>
    FASTEST ROUTE:<br>
    → <a href="mailto:nouraldeentofi@gmail.com?subject=Withdrawal%20from%20Bank%20of%20Nour&body=I%27d%20like%20to%20withdraw%3A%20one%20project%2C%20please.">EMAIL: nouraldeentofi@gmail.com</a><br>
    → <a href="https://www.linkedin.com/in/nour-aldeen-tofi-19b116240" target="_blank" rel="noopener">LINKEDIN /nour-aldeen-tofi</a><br>
    → <a href="https://nouraldeentofi.netlify.app" target="_blank" rel="noopener">WEBSITE nouraldeentofi.netlify.app</a><br><br>
    BRANCH: RIYADH · LANGUAGES: AR + EN<br>
    <span style="opacity:.7">THIS MACHINE NEVER RUNS OUT. PRESS CANCEL FOR MENU</span>`;
}
</script>
</body>
</html>
