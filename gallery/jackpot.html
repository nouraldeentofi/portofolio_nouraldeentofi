<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nour Aldeen Tofi — JACKPOT · Lucky Client Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Rubik:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--felt:#3a1230;--feltd:#240a1e;--gold:#f0c24a;--goldd:#a8802e;--fg:#fdf3e0;--dim:rgba(253,243,224,.65);
        --red:#e04545;--green:#3dbb7a;--chrome:#d8dce4}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Rubik',sans-serif;color:var(--fg);min-height:100vh;
    background:radial-gradient(80vw 60vh at 50% 0%,#5c1e4a,var(--felt) 55%,var(--feltd));
    display:flex;flex-direction:column;align-items:center;padding:4vh 4vw 8vh}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--gold);color:#3a1230}
  h1{font-family:'Alfa Slab One',cursive;font-size:clamp(24px,5vw,44px);color:var(--gold);
    text-shadow:0 3px 0 var(--goldd), 0 0 30px rgba(240,194,74,.4)}
  .sub{font-size:11px;letter-spacing:.26em;color:var(--dim);margin:8px 0 22px;text-transform:uppercase;text-align:center}

  #machine{position:relative;width:min(480px,95vw);background:linear-gradient(180deg,#e04545,#a82e2e 40%,#7a1e1e);
    border-radius:26px 26px 14px 14px;padding:20px 20px 16px;box-shadow:0 40px 80px rgba(0,0,0,.55), inset 0 3px 0 rgba(255,255,255,.3)}
  #lights{display:flex;justify-content:center;gap:10px;margin-bottom:12px}
  #lights i{width:12px;height:12px;border-radius:50%;background:#5c1414}
  #lights i.on{background:var(--gold);box-shadow:0 0 12px var(--gold)}
  #reelBox{background:#1c0f0a;border-radius:14px;border:4px solid var(--goldd);padding:14px;display:flex;gap:10px;
    box-shadow:inset 0 6px 20px rgba(0,0,0,.7)}
  .reel{flex:1;height:110px;background:linear-gradient(180deg,#efe8d8,#fdf8ec 30%,#fdf8ec 70%,#d8ccb8);border-radius:8px;
    overflow:hidden;position:relative;box-shadow:inset 0 4px 10px rgba(0,0,0,.3)}
  .strip{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;will-change:transform}
  .cell{height:110px;display:flex;align-items:center;justify-content:center;font-size:52px;flex-shrink:0}
  .reel::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,transparent 70%,rgba(0,0,0,.35))}
  #payline{position:absolute;left:26px;right:26px;top:50%;height:3px;background:rgba(224,69,69,.5);pointer-events:none}

  #resultLb{margin-top:12px;text-align:center;font-family:'Alfa Slab One';font-size:clamp(13px,2.6vw,18px);
    color:var(--gold);min-height:26px;letter-spacing:.04em}
  #creditRow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;
    font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
  #spins{color:var(--gold);font-weight:900}

  /* lever */
  #lever{position:absolute;right:-42px;top:110px;width:34px;height:170px;cursor:grab}
  #stick{position:absolute;left:12px;top:14px;width:10px;height:120px;background:linear-gradient(90deg,#f0f2f5,var(--chrome));
    border-radius:6px;transform-origin:bottom center;transition:transform .15s}
  #ballKnob{position:absolute;left:-6px;top:-14px;width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 36% 30%,#ff8a80,var(--red) 60%,#7a1e1e)}
  #leverBase{position:absolute;bottom:16px;left:4px;width:26px;height:26px;border-radius:6px;background:#5c1414}
  #lever.pulled #stick{transform:rotate(0.5turn) translateY(-2px);transform:scaleY(-.75) }
  @media(max-width:560px){#lever{display:none}}

  #spinB{width:100%;margin-top:12px;font-family:'Alfa Slab One';font-size:19px;letter-spacing:.1em;border:none;
    border-radius:14px;padding:16px;background:var(--gold);color:#3a1230;cursor:pointer;
    box-shadow:0 6px 0 var(--goldd);transition:transform .1s,box-shadow .1s}
  #spinB:active{transform:translateY(5px);box-shadow:0 1px 0 var(--goldd)}
  #spinB:disabled{filter:grayscale(.5);pointer-events:none}

  /* prize card */
  #prize{margin-top:20px;width:min(520px,95vw);background:#fdf8ec;color:#3a2a18;border-radius:16px;padding:24px 28px;
    text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4);display:none}
  #prize.show{display:block;animation:pin .4s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pin{from{transform:translateY(20px) scale(.92);opacity:0}}
  #prize .k{font-size:10px;letter-spacing:.3em;color:var(--red);text-transform:uppercase;font-weight:900}
  #prize h2{font-family:'Alfa Slab One';font-size:clamp(18px,3.4vw,26px);margin:8px 0}
  #prize p{font-size:13px;line-height:1.7;color:rgba(58,42,24,.8)}
  #prize p b{color:#3a2a18}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .btn{font-weight:900;font-size:11.5px;letter-spacing:.08em;padding:12px 20px;border-radius:99px;
    background:#3a2a18;color:#fdf8ec;text-transform:uppercase}
  .btn.g{background:transparent;border:2px solid #3a2a18;color:#3a2a18}
  .conf{position:fixed;z-index:80;width:8px;height:12px;pointer-events:none}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<h1>🎰 LUCKY CLIENT</h1>
<div class="sub">Every spin wins something · jackpot = an offer you can't refuse · جرّب حظك</div>

<div id="machine">
  <div id="lights"></div>
  <div id="reelBox">
    <div class="reel"><div class="strip" id="s0"></div></div>
    <div class="reel"><div class="strip" id="s1"></div></div>
    <div class="reel"><div class="strip" id="s2"></div></div>
    <div id="payline"></div>
  </div>
  <div id="resultLb">PULL THE LEVER OR PRESS SPIN</div>
  <div id="creditRow"><span>CREDITS: ∞ (talent never runs out)</span><span>SPINS: <span id="spins">0</span></span></div>
  <button id="spinB">SPIN!</button>
  <div id="lever"><div id="leverBase"></div><div id="stick"><div id="ballKnob"></div></div></div>
</div>

<div id="prize"><div class="k" id="pk"></div><h2 id="ph"></h2><p id="pp"></p><div class="btns" id="pb"></div></div>

<script>
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const SYMS=['⚛️','🎨','📱','🧭','💍','7️⃣'];
const PRIZES={
 '⚛️':{k:'Match · React',h:'FREE QUOTE — React Frontend',
   p:`Three atoms! <b>React frontends</b> are Nour's daily craft — components, dashboards, full UIs in TypeScript + Tailwind, at supervisor quality. Your prize: a free project quote.`},
 '🎨':{k:'Match · Design',h:'BRAND PACKAGE UNLOCKED',
   p:`Triple palette! <b>Logo + business cards + visual identity.</b> A brand people remember, print-ready files included.`},
 '📱':{k:'Match · Social',h:'SOCIAL MEDIA COMBO',
   p:`Three phones! <b>Instagram & LinkedIn visual packs</b> — consistent, branded, engaging. Your feed finally looks alive.`},
 '🧭':{k:'Match · Coordination',h:'PROJECT PILOT WON',
   p:`Triple compass! <b>Remote project coordination</b>: scope, user stories, timelines, quality. Track record: GoldenTag shipped to Google Play.`},
 '💍':{k:'Match · GoldenTag',h:'THE PROOF RING',
   p:`Three rings — like <b>GoldenTag</b>, the jewelry store app Nour coordinated end-to-end onto Google Play. That's not luck, that's process.`},
 '7️⃣':{k:'JACKPOT · 777',h:'🎉 THE UNREFUSABLE OFFER',
   p:`<b>Everything, together:</b> website + brand + social + coordination, from one supervisor-level developer in Riyadh (AR+EN). First consultation free. This offer never expires.`}
};
const CONSOLATION={k:'No match — still a win',h:'CONSOLATION PRIZE: THE TRUTH',
  p:`Random reels, reliable developer. <b>Nour Aldeen Tofi</b> — ~3 yrs professional, Meta/Google/IBM certified, ICPC 2021, B.Tech IT. Spin again for the jackpot, or skip the luck and just email him.`};

/* lights */
const lights=document.getElementById('lights');
for(let i=0;i<12;i++)lights.appendChild(document.createElement('i'));
if(!reduced)setInterval(()=>{[...lights.children].forEach((d,i)=>
  d.classList.toggle('on',(i+Math.floor(Date.now()/200))%3===0));},200);

let AC=null;
function tick(f){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f||900;
  g.gain.setValueAtTime(.03,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.05);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.06);}catch(e){}}
function fanfare(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>{
  try{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(.08,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.35);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.4);}catch(e){}},i*140));}

/* build strips */
const CYCLE=[];for(let r=0;r<8;r++)CYCLE.push(...SYMS);
const strips=[0,1,2].map(i=>{
  const el=document.getElementById('s'+i);
  CYCLE.forEach(s=>{const c=document.createElement('div');c.className='cell';c.textContent=s;el.appendChild(c);});
  return el;
});
const CH=110;
let spinning=false,spins=0;
function setPos(el,idx){el.style.transform=`translateY(${-idx*CH}px)`;}
strips.forEach(s=>setPos(s,2));

async function spin(forced){
  if(spinning)return;spinning=true;
  spins++;document.getElementById('spins').textContent=spins;
  document.getElementById('prize').classList.remove('show');
  document.getElementById('resultLb').textContent='SPINNING…';
  document.getElementById('spinB').disabled=true;
  /* choose outcome: every 3rd spin jackpot; 60% match otherwise */
  let result;
  if(forced==='777'||spins%3===0)result=['7️⃣','7️⃣','7️⃣'];
  else if(Math.random()<.6){const s=SYMS[Math.floor(Math.random()*(SYMS.length-1))];result=[s,s,s];}
  else{result=[0,1,2].map(()=>SYMS[Math.floor(Math.random()*SYMS.length)]);
    if(result[0]===result[1]&&result[1]===result[2])result[2]=SYMS[(SYMS.indexOf(result[2])+1)%SYMS.length];}
  /* animate each reel */
  await Promise.all(strips.map((el,i)=>new Promise(res=>{
    const stopSym=result[i];
    const targetIdx=CYCLE.length-SYMS.length+SYMS.indexOf(stopSym)-1;
    const dur=reduced?200:1400+i*600;
    const start=performance.now();
    const startIdx=2;
    function anim(t){
      const p=Math.min(1,(t-start)/dur);
      const e=1-Math.pow(1-p,3);
      const idx=startIdx+(targetIdx-startIdx)*e;
      setPos(el,idx);
      if(Math.random()<.35)tick(700+i*120);
      if(p<1)requestAnimationFrame(anim);
      else{setPos(el,targetIdx);res();}
    }
    requestAnimationFrame(anim);
  })));
  /* result */
  const win=result[0]===result[1]&&result[1]===result[2];
  const pr=win?PRIZES[result[0]]:CONSOLATION;
  document.getElementById('resultLb').textContent=win?(result[0]==='7️⃣'?'★ JACKPOT 777 ★':'WINNER! '+result.join(' ')):'SO CLOSE! '+result.join(' ');
  if(win)fanfare();
  if(win&&result[0]==='7️⃣'&&!reduced)confetti();
  showPrize(pr,win&&result[0]==='7️⃣');
  document.getElementById('spinB').disabled=false;
  spinning=false;
}
function showPrize(pr,jack){
  document.getElementById('pk').textContent=pr.k;
  document.getElementById('ph').textContent=pr.h;
  document.getElementById('pp').innerHTML=pr.p;
  document.getElementById('pb').innerHTML=`
    <a class="btn" href="mailto:nouraldeentofi@gmail.com?subject=${encodeURIComponent('I won at the slot machine: '+pr.h)}&body=Claiming%20my%20prize%21%20My%20project%3A%20">🎁 Claim prize (email)</a>
    <a class="btn g" href="https://www.linkedin.com/in/nour-aldeen-tofi-19b116240" target="_blank" rel="noopener">LinkedIn</a>
    <a class="btn g" href="https://nouraldeentofi.netlify.app" target="_blank" rel="noopener">Website</a>`;
  document.getElementById('prize').classList.add('show');
}
function confetti(){
  for(let i=0;i<70;i++){
    const c=document.createElement('div');c.className='conf';
    c.style.cssText=`left:${45+Math.random()*10}vw;top:30vh;background:${['#f0c24a','#e04545','#3dbb7a','#fff'][i%4]}`;
    document.body.appendChild(c);
    c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},
      {transform:`translate(${(Math.random()-.5)*60}vw,${40+Math.random()*40}vh) rotate(${Math.random()*720}deg)`,opacity:0}],
      {duration:1600+Math.random()*900,easing:'cubic-bezier(.2,.6,.6,1)'}).onfinish=()=>c.remove();
  }
}
document.getElementById('spinB').onclick=()=>spin();
/* lever */
const lever=document.getElementById('lever');
lever.addEventListener('pointerdown',()=>{
  lever.classList.add('pulled');tick(400);
  setTimeout(()=>{lever.classList.remove('pulled');spin();},250);
});
addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();spin();}});
</script>
</body>
</html>
