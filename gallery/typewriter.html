<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nour Aldeen Tofi — TYPEWRITER · You Write the Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{--desk:#3a4a3e;--deskd:#2a3730;--paper:#f7f2e2;--ink:#2b2620;--faint:rgba(43,38,32,.55);--red:#b3402e;--metal:#4a4640}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Courier Prime',monospace;background:linear-gradient(180deg,#4a5c4e,var(--desk) 50%,var(--deskd));
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:4vh 4vw 8vh;color:#e8e4d4}
  a{color:inherit}
  ::selection{background:var(--red);color:#fff}
  h1{font-family:'Special Elite',cursive;font-size:clamp(22px,4.4vw,38px)}
  h1 span{color:#f0c9a0}
  .sub{font-size:11px;letter-spacing:.24em;opacity:.75;margin:8px 0 24px;text-transform:uppercase;text-align:center}

  /* paper */
  #paperWrap{width:min(680px,95vw);perspective:900px}
  #paper{background:var(--paper);color:var(--ink);min-height:400px;max-height:52vh;overflow-y:auto;
    padding:40px 44px 60px;box-shadow:0 24px 60px rgba(0,0,0,.45);
    background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(43,38,32,.05) 27px 28px)}
  #text{font-size:15px;line-height:28px;white-space:pre-wrap;word-wrap:break-word}
  #text .h{font-family:'Special Elite',cursive;font-weight:400;color:var(--red)}
  #text b{font-weight:700}
  #caret{display:inline-block;width:9px;height:18px;background:var(--ink);vertical-align:text-bottom;
    animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  #text a{color:var(--red);font-weight:700}

  /* typewriter body */
  #machine{width:min(720px,97vw);margin-top:-8px;position:relative;z-index:2}
  #roller{height:26px;background:linear-gradient(180deg,#1d1a16,#3a352e 50%,#1d1a16);border-radius:13px;
    box-shadow:0 6px 14px rgba(0,0,0,.4)}
  #bodyTop{height:56px;background:linear-gradient(180deg,#5c564c,var(--metal));border-radius:8px 8px 0 0;margin:6px 8px 0;
    display:flex;align-items:center;justify-content:space-between;padding:0 22px}
  #brand{font-family:'Special Elite',cursive;font-size:14px;color:#e8ddc0;letter-spacing:.14em}
  #bell{font-size:18px;filter:grayscale(.3)}
  #keys{background:linear-gradient(180deg,var(--metal),#332f29);border-radius:0 0 16px 16px;margin:0 8px;
    padding:16px 18px 20px;display:flex;flex-direction:column;gap:9px;align-items:center;
    box-shadow:0 24px 50px rgba(0,0,0,.5)}
  .krow{display:flex;gap:8px}
  .key{width:clamp(26px,4.4vw,40px);aspect-ratio:1;border-radius:50%;border:2px solid #14120e;cursor:pointer;
    background:radial-gradient(circle at 38% 32%,#4a453c,#211e19);color:#e8ddc0;
    font-family:'Courier Prime';font-size:clamp(9px,1.6vw,12px);font-weight:700;
    box-shadow:0 4px 0 #14120e;transition:transform .05s,box-shadow .05s;display:flex;align-items:center;justify-content:center}
  .key:active,.key.hit{transform:translateY(3px);box-shadow:0 1px 0 #14120e}
  .key.space{width:clamp(150px,30vw,260px);aspect-ratio:auto;height:clamp(26px,4.4vw,36px);border-radius:10px}
  #progress{margin-top:16px;font-size:10px;letter-spacing:.3em;opacity:.7;text-transform:uppercase;text-align:center}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<h1>THE <span>NOUR</span>WRITER № 26</h1>
<div class="sub">Mash ANY keys — the machine knows the story · like hacker-typer, but employable · دقّ عالمكنة</div>

<div id="paperWrap"><div id="paper"><div id="text"></div><span id="caret"></span></div></div>

<div id="machine">
  <div id="roller"></div>
  <div id="bodyTop"><div id="brand">◈ NOURWRITER DELUXE</div><div id="bell">🔔</div></div>
  <div id="keys"></div>
</div>
<div id="progress">STORY: <span id="pct">0</span>% TYPED — KEEP HAMMERING</div>

<script>
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const STORY=
`<span class="h">CHAPTER ONE — THE SUBJECT.</span>
His name is <b>Nour Aldeen Tofi</b>. Frontend developer. Software engineering supervisor. Based in Riyadh, Saudi Arabia. Fluent in Arabic, English, and clean code.

<span class="h">CHAPTER TWO — THE EDUCATION.</span>
Five years at the <b>University of Kalamoon (2019-2024)</b>, B.Tech in Information Technology. In 2021 he walked into the <b>ICPC/ACPC</b> arena and came out with reflexes that still fire on every code review.

<span class="h">CHAPTER THREE — THE WORK.</span>
2023: <b>Minicodeleader</b> — first React role. Component-driven, disciplined.
2024: <b>Khwarizm Technologies, Riyadh</b> — production React beside design and backend.
2025: <b>Distinctive Frontier Co.</b> — frontend AND project coordination, both at once.
2025, in parallel: <b>NexLead</b>, freelance project coordinator. Requirements, user stories, releases. He shipped <b>GoldenTag</b> to Google Play — inventory, barcode scanning, USD/SYP rates.
January 2026: promoted. <b>Software Engineering Supervisor.</b> React systems, coding standards, backend alignment, features shipped on time.

<span class="h">CHAPTER FOUR — THE TOOLBOX.</span>
React. TypeScript. Tailwind. JavaScript. Python for data and AI. Git, Jira, Trello, prompt engineering. Certified by Meta, Google (twice), IBM (twice), and more.

<span class="h">CHAPTER FIVE — THE ENDING YOU WRITE.</span>
Websites. React frontends. Logos. Business cards. Social visuals. Project coordination.
Off duty: anime, chess, badminton, film.
Reach him: <a href="mailto:nouraldeentofi@gmail.com">nouraldeentofi@gmail.com</a> — <a href="https://www.linkedin.com/in/nour-aldeen-tofi-19b116240" target="_blank" rel="noopener">LinkedIn</a> — <a href="https://nouraldeentofi.netlify.app" target="_blank" rel="noopener">Website</a>

<span class="h">THE END.</span> (or the beginning — your call.)`;

/* tokenize: tags atomic, text char-by-char */
const TOKENS=STORY.match(/<[^>]+>|[\s\S]/g)||[];
let pos=0;
const textEl=document.getElementById('text'),paper=document.getElementById('paper');

let AC=null;
function clack(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const b=AC.createBuffer(1,AC.sampleRate*.05,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=AC.createBufferSource();s.buffer=b;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2400+Math.random()*800;
  const g=AC.createGain();g.gain.value=.09;
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start();}catch(e){}}
function dingS(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=1245;
  g.gain.setValueAtTime(.08,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+1);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+1.05);}catch(e){}}

let out='';
function typeChunk(){
  if(pos>=TOKENS.length)return;
  let n=2+Math.floor(Math.random()*3);
  while(n-->0&&pos<TOKENS.length){
    const t=TOKENS[pos++];
    out+=t;
    if(t==='\n'){dingS();if(!reduced)document.getElementById('bell').animate(
      [{transform:'rotate(0)'},{transform:'rotate(-24deg)'},{transform:'rotate(14deg)'},{transform:'rotate(0)'}],{duration:340});}
  }
  textEl.innerHTML=out;
  clack();
  if(!reduced)document.getElementById('roller').animate(
    [{transform:'translateX(0)'},{transform:'translateX(-2px)'},{transform:'translateX(0)'}],{duration:60});
  paper.scrollTop=paper.scrollHeight;
  document.getElementById('pct').textContent=Math.min(100,Math.round(pos/TOKENS.length*100));
  if(pos>=TOKENS.length){
    document.getElementById('progress').innerHTML='STORY COMPLETE — <b style="color:#f0c9a0">NOW WRITE HIM AN EMAIL</b> ⌨';
    document.getElementById('caret').style.display='none';
  }
}

/* real keyboard */
addEventListener('keydown',e=>{
  if(e.key==='Tab')return;
  e.preventDefault();
  typeChunk();
  flashRandomKey();
});
/* on-screen keys */
const ROWS=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
const keysEl=document.getElementById('keys');
ROWS.forEach(r=>{
  const row=document.createElement('div');row.className='krow';
  r.split('').forEach(ch=>{
    const k=document.createElement('button');k.className='key';k.textContent=ch;
    k.onclick=()=>{typeChunk();hitKey(k);};
    row.appendChild(k);
  });
  keysEl.appendChild(row);
});
const spaceRow=document.createElement('div');spaceRow.className='krow';
const sp=document.createElement('button');sp.className='key space';sp.textContent='SPACE — TYPE FASTER';
sp.onclick=()=>{typeChunk();typeChunk();hitKey(sp);};
spaceRow.appendChild(sp);
keysEl.appendChild(spaceRow);
function hitKey(k){k.classList.add('hit');setTimeout(()=>k.classList.remove('hit'),90);}
function flashRandomKey(){
  const all=keysEl.querySelectorAll('.key');
  hitKey(all[Math.floor(Math.random()*all.length)]);
}
/* gentle attract mode: if idle 6s, type a little */
let lastAct=Date.now();
addEventListener('keydown',()=>lastAct=Date.now());
addEventListener('pointerdown',()=>lastAct=Date.now());
if(!reduced)setInterval(()=>{
  if(Date.now()-lastAct>6000&&pos<TOKENS.length*0.08)typeChunk();
},900);
</script>
</body>
</html>
