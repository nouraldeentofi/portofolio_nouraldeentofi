<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nour Aldeen Tofi — DARTS · Hit a Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Karla:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--pub:#241a14;--pubd:#160f0c;--fg:#f2ead8;--dim:rgba(242,234,216,.6);--red3:#c0392e;--green3:#1d7a4a;--gold4:#e8b93c}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Karla',sans-serif;color:var(--fg);min-height:100vh;
    background:radial-gradient(80vw 60vh at 50% 20%,#38281e,var(--pub) 55%,var(--pubd));
    display:flex;flex-direction:column;align-items:center;padding:4vh 4vw 8vh}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--gold4);color:#241a14}
  h1{font-family:'Lilita One';font-size:clamp(24px,4.8vw,42px)}
  h1 span{color:var(--gold4)}
  .sub{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.26em;color:var(--dim);
    margin:6px 0 20px;text-transform:uppercase;text-align:center}

  #range{position:relative;width:min(420px,92vw);aspect-ratio:1;cursor:crosshair}
  #boardD{position:absolute;inset:0;border-radius:50%;
    box-shadow:0 24px 60px rgba(0,0,0,.5), 0 0 0 14px #3a2a1e, 0 0 0 18px #17100c}
  #boardD svg{width:100%;height:100%;display:block}
  .dart{position:absolute;z-index:8;font-size:26px;transform:translate(-50%,-80%) rotate(45deg);
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.5));pointer-events:none}
  #aimHint{position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);font-family:'IBM Plex Mono';
    font-size:9.5px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase;white-space:nowrap;animation:hb3 2s infinite}
  @keyframes hb3{0%,100%{opacity:.35}50%{opacity:1}}

  #scoreCard{margin-top:48px;width:min(520px,95vw);background:#f5ecdc;color:#2a1c14;border-radius:14px;
    padding:22px 26px;box-shadow:0 20px 50px rgba(0,0,0,.45);text-align:center;min-height:130px}
  #scoreCard .k{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.28em;color:var(--red3);text-transform:uppercase;font-weight:600}
  #scoreCard h2{font-family:'Lilita One';font-size:clamp(18px,3.4vw,26px);margin:8px 0 6px}
  #scoreCard p{font-size:13px;line-height:1.65;color:rgba(42,28,20,.75)}
  #scoreCard p b{color:#2a1c14}
  #throws{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.2em;color:rgba(42,28,20,.6);margin-top:8px}
  .btns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .btn{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.1em;padding:11px 18px;border-radius:99px;
    background:#2a1c14;color:#f5ecdc;text-transform:uppercase;font-weight:600}
  .btn.g{background:none;border:2px solid #2a1c14;color:#2a1c14}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<h1>🎯 THE NOUR <span>ARMS</span></h1>
<div class="sub">Pub rules: click the board to throw · the board spins, aim well · صوّب</div>

<div id="range">
  <div id="boardD">
    <svg viewBox="-110 -110 220 220" id="bsvg"></svg>
  </div>
  <div id="aimHint">◈ CLICK ANYWHERE ON THE BOARD ◈</div>
</div>

<div id="scoreCard">
  <div class="k">Dartboard of services</div>
  <h2>Every sector is something he does</h2>
  <p>Outer ring = services · inner ring = proof · <b>bullseye = the special offer.</b> Throw!</p>
  <div id="throws">DARTS THROWN: 0</div>
  <div class="btns" id="dBtns"></div>
</div>

<script>
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const SECTORS=[
 ['WEBSITES','#c0392e','<b>Websites</b> — landing pages, portfolios, business sites. Fast, modern, mobile-first.'],
 ['REACT','#1d7a4a','<b>React frontends</b> — TypeScript + Tailwind at supervisor grade (Distinctive Frontier Co. \'26→).'],
 ['LOGOS','#c0392e','<b>Logos &amp; business cards</b> — a brand people remember.'],
 ['SOCIAL','#1d7a4a','<b>Social media visuals</b> — Instagram &amp; LinkedIn packs that actually engage.'],
 ['COORDINATION','#c0392e','<b>Project coordination</b> — scope → stories → releases. GoldenTag went to Google Play on this sector.'],
 ['CLEAN CODE','#1d7a4a','<b>Clean code</b> — Scrimba \'24 + daily discipline. No spaghetti on this dartboard.'],
 ['CERTS ×10','#c0392e','<b>Meta · Google ×2 · IBM ×2</b> + more. Paper trail of a serious player.'],
 ['ICPC \'21','#1d7a4a','<b>ICPC/ACPC 2021</b> — competitive programming. He aims fast and true.']
];
const svg=document.getElementById('bsvg');
function arcPath(a0,a1,r0,r1){
  const x0=Math.cos(a0)*r1,y0=Math.sin(a0)*r1,x1=Math.cos(a1)*r1,y1=Math.sin(a1)*r1;
  const x2=Math.cos(a1)*r0,y2=Math.sin(a1)*r0,x3=Math.cos(a0)*r0,y3=Math.sin(a0)*r0;
  return `M${x0} ${y0} A${r1} ${r1} 0 0 1 ${x1} ${y1} L${x2} ${y2} A${r0} ${r0} 0 0 0 ${x3} ${y3}Z`;
}
let inner='';
SECTORS.forEach((s,i)=>{
  const a0=(i/8)*Math.PI*2-Math.PI/2,a1=((i+1)/8)*Math.PI*2-Math.PI/2;
  inner+=`<path d="${arcPath(a0,a1,44,100)}" fill="${s[1]}" stroke="#f2ead8" stroke-width="1.6"/>`;
  const mid=(a0+a1)/2;
  inner+=`<text x="${Math.cos(mid)*74}" y="${Math.sin(mid)*74}" text-anchor="middle" dominant-baseline="middle"
    font-family="IBM Plex Mono" font-size="7.5" font-weight="600" fill="#f5ecdc"
    transform="rotate(${mid*180/Math.PI+90} ${Math.cos(mid)*74} ${Math.sin(mid)*74})">${s[0]}</text>`;
});
inner+=`<circle r="44" fill="#17100c" stroke="#f2ead8" stroke-width="1.6"/>
 <text y="-26" text-anchor="middle" font-family="IBM Plex Mono" font-size="7" fill="#c9b896">INNER RING</text>
 <text y="-16" text-anchor="middle" font-family="IBM Plex Mono" font-size="7.5" font-weight="600" fill="#f5ecdc">SHIPPED PROOF</text>
 <circle r="12" fill="#e8b93c" stroke="#17100c" stroke-width="2"/>
 <text y="2.6" text-anchor="middle" font-family="Lilita One" font-size="7" fill="#17100c">OFFER</text>`;
svg.innerHTML=`<g id="rot">${inner}</g>`;
/* slow spin */
let rot=0;
if(!reduced)(function spin(){rot+=.12;document.getElementById('rot').setAttribute('transform',`rotate(${rot})`);requestAnimationFrame(spin);})();

let AC=null;
function thunk(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=190;
  g.gain.setValueAtTime(.14,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.14);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.16);
  const b=AC.createBuffer(1,AC.sampleRate*.05,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=AC.createBufferSource();s.buffer=b;const g2=AC.createGain();g2.gain.value=.05;
  s.connect(g2);g2.connect(AC.destination);s.start();}catch(e){}}
function tada(){[659,880,1100].forEach((f,i)=>setTimeout(()=>{
  try{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(.07,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.3);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.35);}catch(e){}},i*120));}

let throws=0;
const range=document.getElementById('range');
range.addEventListener('pointerdown',e=>{
  const r=range.getBoundingClientRect();
  /* small wobble: dart lands near click */
  const wob=reduced?0:14;
  const px=e.clientX-r.left+(Math.random()-.5)*wob;
  const py=e.clientY-r.top+(Math.random()-.5)*wob;
  const dart=document.createElement('div');dart.className='dart';dart.textContent='🎯';
  dart.style.left=px+'px';dart.style.top=py+'px';
  range.appendChild(dart);
  if(range.querySelectorAll('.dart').length>5)range.querySelector('.dart').remove();
  if(!reduced)dart.animate([{transform:'translate(-50%,-80%) rotate(45deg) scale(2.4)',opacity:.4},
    {transform:'translate(-50%,-80%) rotate(45deg) scale(1)',opacity:1}],{duration:180,easing:'cubic-bezier(.2,.9,.3,1)'});
  thunk();
  throws++;
  document.getElementById('throws').textContent='DARTS THROWN: '+throws;
  /* score: distance from center in board coords, accounting rotation */
  const cx=px-r.width/2,cy=py-r.height/2;
  const dist=Math.hypot(cx,cy)/(r.width/2)*110;
  const k=document.querySelector('#scoreCard .k'),h=document.querySelector('#scoreCard h2'),p=document.querySelector('#scoreCard p');
  const btns=document.getElementById('dBtns');btns.innerHTML='';
  if(dist<=12){
    tada();
    k.textContent='★ BULLSEYE — THE SPECIAL OFFER ★';
    h.textContent='Free first consultation + fair quote';
    p.innerHTML=`Dead center. <b>Nour Aldeen Tofi</b> — frontend dev &amp; SW engineering supervisor, Riyadh — will scope your project free, then quote it fairly. That's the whole offer. No fine print in this pub.`;
    btns.innerHTML=`<a class="btn" href="mailto:nouraldeentofi@gmail.com?subject=Bullseye!&body=Hit%20the%20center%20in%20${throws}%20darts.%20My%20project%3A%20">🎯 Claim it</a>
      <a class="btn g" href="https://www.linkedin.com/in/nour-aldeen-tofi-19b116240" target="_blank" rel="noopener">LinkedIn</a>
      <a class="btn g" href="https://nouraldeentofi.netlify.app" target="_blank" rel="noopener">Website</a>`;
  }else if(dist<=44){
    k.textContent='INNER RING · SHIPPED PROOF';
    h.textContent='GoldenTag — live on Google Play';
    p.innerHTML=`The proof ring: a jewelry store management app <b>coordinated end-to-end</b> at NexLead — inventory, barcode scanning, USD/SYP rates. That\'s what "delivers" means.`;
    btns.innerHTML=`<a class="btn" href="mailto:nouraldeentofi@gmail.com">✉ Email</a>`;
  }else if(dist<=100){
    /* find sector accounting rotation */
    let ang=Math.atan2(cy,cx)+Math.PI/2-rot*Math.PI/180;
    ang=((ang%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
    const si=Math.floor(ang/(Math.PI*2)*8)%8;
    const s=SECTORS[si];
    k.textContent='SECTOR HIT · '+s[0];
    h.textContent=s[0].charAt(0)+s[0].slice(1).toLowerCase();
    p.innerHTML=s[2];
    btns.innerHTML=`<a class="btn" href="mailto:nouraldeentofi@gmail.com?subject=${encodeURIComponent('Darts: '+s[0])}&body=Hit%20your%20${encodeURIComponent(s[0])}%20sector.%20Let%27s%20talk%3A%20">✉ Ask about this</a>`;
  }else{
    k.textContent='OFF THE BOARD';
    h.textContent='Happens to everyone. Throw again!';
    p.innerHTML='Even ICPC players miss sometimes. (Rarely. In 2021 he mostly didn\'t.)';
  }
});
</script>
</body>
</html>
