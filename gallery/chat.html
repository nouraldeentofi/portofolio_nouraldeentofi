<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nour Aldeen Tofi — CHAT · Talk to the Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f1216;--panel:#151a21;--bot:#1c232d;--fg:#eef2f6;--dim:rgba(238,242,246,.55);
        --lime:#b8ff5c;--mint:#5ce1a9;--line:rgba(238,242,246,.1)}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'Figtree',sans-serif;background:var(--bg);color:var(--fg);display:flex;justify-content:center}
  body::before{content:'';position:fixed;inset:0;
    background:radial-gradient(60vw 40vh at 80% 0%,rgba(184,255,92,.05),transparent 60%),
               radial-gradient(50vw 40vh at 10% 100%,rgba(92,225,169,.05),transparent 60%)}
  #app{position:relative;width:min(680px,100vw);height:100%;display:flex;flex-direction:column;background:var(--panel);
    border-left:1px solid var(--line);border-right:1px solid var(--line)}

  /* header */
  header{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);
    background:rgba(21,26,33,.85);backdrop-filter:blur(8px);z-index:5}
  .ava{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--lime),var(--mint));
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#10281a;font-size:17px;position:relative;flex-shrink:0}
  .ava::after{content:'';position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;
    background:#3ddc84;border:3px solid var(--panel)}
  header .who b{font-size:15.5px;font-weight:800;display:block}
  header .who span{font-size:12px;color:var(--dim)}
  header .tag{margin-left:auto;font-size:10px;letter-spacing:.2em;color:var(--dim);border:1px solid var(--line);
    padding:6px 12px;border-radius:99px;text-transform:uppercase}

  /* thread */
  #thread{flex:1;overflow-y:auto;padding:26px 20px 16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
  .day{align-self:center;font-size:10.5px;letter-spacing:.2em;color:var(--dim);background:var(--bot);
    padding:6px 14px;border-radius:99px;margin-bottom:8px;text-transform:uppercase}
  .msg{max-width:78%;padding:12px 16px;border-radius:18px;font-size:14.5px;line-height:1.55;
    animation:pop .3s cubic-bezier(.2,.9,.3,1.3);position:relative;word-wrap:break-word}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
  .msg.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:6px}
  .msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--lime),var(--mint));
    color:#10281a;font-weight:600;border-bottom-right-radius:6px}
  .msg b{font-weight:800}
  .msg .t{display:block;font-size:9.5px;color:var(--dim);margin-top:6px;letter-spacing:.06em}
  .msg.user .t{color:rgba(16,40,26,.55)}
  .msg a{color:var(--lime);font-weight:700;text-decoration:none}
  .msg.user a{color:#10281a;text-decoration:underline}

  /* rich card */
  .card{align-self:flex-start;max-width:82%;background:var(--bot);border:1px solid var(--line);border-radius:18px;
    border-bottom-left-radius:6px;overflow:hidden;animation:pop .3s cubic-bezier(.2,.9,.3,1.3)}
  .card .chead{padding:14px 18px;background:linear-gradient(135deg,rgba(184,255,92,.14),rgba(92,225,169,.08));
    font-weight:800;font-size:14.5px;border-bottom:1px solid var(--line)}
  .card .cbody{padding:14px 18px;font-size:13px;line-height:1.6;color:var(--dim)}
  .card .cbody b{color:var(--fg)}
  .card .cfoot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
  .card .cbtn{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:#10281a;background:var(--lime);
    padding:9px 16px;border-radius:99px;text-decoration:none}
  .card .cbtn.ghost{background:transparent;color:var(--lime);border:1px solid var(--lime)}

  /* typing */
  #typing{align-self:flex-start;background:var(--bot);border-radius:18px;border-bottom-left-radius:6px;
    padding:16px 20px;display:none;gap:5px}
  #typing.on{display:flex}
  #typing i{width:8px;height:8px;border-radius:50%;background:var(--dim);animation:tb 1.2s infinite}
  #typing i:nth-child(2){animation-delay:.15s}#typing i:nth-child(3){animation-delay:.3s}
  @keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}

  /* quick replies */
  #replies{display:flex;gap:8px;padding:14px 16px 18px;flex-wrap:wrap;border-top:1px solid var(--line);
    background:rgba(21,26,33,.9);backdrop-filter:blur(8px)}
  .qr{font-family:'Figtree';font-size:13px;font-weight:600;color:var(--lime);background:transparent;
    border:1.5px solid rgba(184,255,92,.5);padding:11px 18px;border-radius:99px;cursor:pointer;transition:all .2s;
    animation:pop .3s both}
  .qr:hover{background:var(--lime);color:#10281a;transform:translateY(-2px)}
  .qr:disabled{opacity:.3;pointer-events:none}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="ava">NT</div>
    <div class="who"><b>Nour Aldeen Tofi</b><span>● online — replies in seconds</span></div>
    <div class="tag">Portfolio v3.0</div>
  </header>
  <div id="thread"><div class="day">Today</div></div>
  <div id="typing"><i></i><i></i><i></i></div>
  <div id="replies"></div>
</div>

<script>
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const thread=document.getElementById('thread'),typing=document.getElementById('typing'),replies=document.getElementById('replies');
const now=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

/* tiny blip */
let AC=null,mute=false;
function blip(f){if(mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(.06,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.12);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.13);}catch(e){}}

function scrollDown(){thread.scrollTop=thread.scrollHeight;}
function addMsg(html,who){
  const d=document.createElement('div');d.className='msg '+who;
  d.innerHTML=html+`<span class="t">${now()}</span>`;
  thread.appendChild(d);scrollDown();blip(who==='bot'?620:840);
}
function addCard(html){const d=document.createElement('div');d.className='card';d.innerHTML=html;
  thread.appendChild(d);scrollDown();blip(620);}

const MENU=[['👤 Who are you?','who'],['💼 What do you do now?','nowrole'],['📜 Work history','history'],
  ['🛠 Skills & certs','skills'],['💍 GoldenTag?','goldentag'],['🤝 Hire you for what?','services'],
  ['🎮 Hobbies?','hobbies'],['📬 Let\'s talk business','contact'],['♞ Chess me','chess']];

const NODES={
  start:{msgs:[
    'Salam! 👋 I\'m Nour — well, the chat version of him.',
    'Frontend developer &amp; software engineering supervisor from <b>Riyadh</b>. This whole portfolio is a conversation.',
    'Ask me anything 👇'],
    opts:MENU},
  who:{msgs:[
    'I\'m <b>Nour Aldeen Tofi</b> — ~3 years of professional frontend work, currently supervising engineers at a safety equipment company in Riyadh.',
    'The unusual part: I do <b>both</b> sides. I write the React <i>and</i> I run the project — requirements, scope, delivery.',
    'B.Tech IT from University of Kalamoon (2019–2024). Arabic + English. 🇸🇦'],
    opts:[['💼 And what\'s the current role?','nowrole'],['📜 Full history','history'],['⌂ Menu','menu']]},
  nowrole:{msgs:[
    'Two hats right now 🎩🎩',
    '<b>1 — Software Engineering Supervisor</b> @ Distinctive Frontier Co. (Jan 2026 → now). I lead frontend: scalable React systems, coding standards, backend alignment, shipping features.',
    '<b>2 — Freelance Project Coordinator</b> @ NexLead (Mar 2025 → now, remote). Requirements → user stories on Trello → quality → releases.'],
    opts:[['💍 What did you ship?','goldentag'],['📜 How did you get here?','history'],['⌂ Menu','menu']]},
  history:{msgs:['Quick rewind ⏪'],card:`
    <div class="chead">📜 The Timeline</div>
    <div class="cbody">
      <b>2026 →</b> Supervisor · Distinctive Frontier Co.<br>
      <b>2025 →</b> Project Coordinator · NexLead (freelance)<br>
      <b>2025</b> Frontend + Coordination · Distinctive Frontier<br>
      <b>2024–25</b> Frontend Dev · Khwarizm Technologies<br>
      <b>2023–24</b> React Dev · Minicodeleader<br>
      <b>2021</b> ICPC / ACPC — competitive programming<br>
      <b>2019–24</b> B.Tech IT · University of Kalamoon
    </div>`,
    msgs2:['Promotion in Jan 2026 — like a pawn reaching the eighth rank. ♟→♛'],
    opts:[['🛠 Skills & certs','skills'],['♞ Wait, you play chess?','chess'],['⌂ Menu','menu']]},
  skills:{msgs:['Daily drivers: <b>React, TypeScript, Tailwind CSS, JavaScript</b>. Side arm: Python (DS/AI). Ops: Git, Jira, Trello, prompt engineering.'],card:`
    <div class="chead">🛠 Certified</div>
    <div class="cbody">
      <b>Meta</b> Advanced React '25 · <b>Coursera</b> TypeScript in React '25<br>
      <b>Google</b> Foundations of PM '25 · Project Initiation '25<br>
      <b>IBM</b> Python for DS &amp; AI '24 · GenAI Prompting '24<br>
      <b>Packt</b> Tailwind '24 · <b>Scrimba</b> Clean Code '24<br>
      <b>Coursera</b> Jira roadmaps &amp; user stories '25
    </div>`,
    msgs2:['Clean code isn\'t on the list — that one\'s a personality trait 😌'],
    opts:[['🤝 What can I hire you for?','services'],['📬 Contact','contact'],['⌂ Menu','menu']]},
  goldentag:{msgs:['Ah, my favorite delivery 💍'],card:`
    <div class="chead">💍 GoldenTag — live on Google Play</div>
    <div class="cbody">Jewelry store management app I coordinated end-to-end at NexLead: <b>inventory, employees, barcode scanning, USD/SYP exchange rates, sales logging, TXT export</b>. Requirements → user stories → release.</div>
    <div class="cfoot"><a class="cbtn" href="https://play.google.com/store/apps/details?id=com.leadbridge.golden_tag" target="_blank" rel="noopener">View on Google Play</a></div>`,
    msgs2:['Real users, real gold, real exchange-rate headaches. Shipped anyway. ✅'],
    opts:[['🤝 Services','services'],['📬 Contact','contact'],['⌂ Menu','menu']]},
  services:{msgs:['Here\'s what people hire me for 👇'],card:`
    <div class="chead">🤝 Open for</div>
    <div class="cbody"><b>Websites</b> — landing pages, portfolios, business sites<br>
    <b>React frontends</b> — components, dashboards, full UIs<br>
    <b>Design</b> — logos, business cards, social media visuals<br>
    <b>Coordination</b> — running your remote dev team end-to-end</div>`,
    msgs2:['Small scope or full project — both welcome.'],
    opts:[['📬 Let\'s talk','contact'],['💼 Current work','nowrole'],['⌂ Menu','menu']]},
  hobbies:{msgs:[
    'Off the clock: <b>anime</b> 🎌, <b>chess</b> ♟, <b>badminton</b> 🏸, movies &amp; series 🎬.',
    'Anime taught me long-arc storytelling, chess taught me to think three moves ahead. Both leak into my sprints, honestly.'],
    opts:[['♞ Chess me','chess'],['👤 Back to serious stuff','who'],['⌂ Menu','menu']]},
  chess:{msgs:['You dare? Bold. I open: <b>1. d4</b> — London System incoming ☕'],
    opts:[['1... d5','chess2'],['1... Nf6','chess2'],['Flip the board and run','chessrun']]},
  chess2:{msgs:['Solid. <b>2. Bf4</b>. I\'ve played this structure a thousand times.',
    'Fast-forward 30 moves: I\'m up a pawn in the endgame and you\'re in time trouble 😄',
    'ICPC 2021 taught me: calculate fast, stay calm, convert the advantage. Same thing I do with deadlines.'],
    opts:[['🤝 Okay, hired','services'],['📬 Contact','contact'],['⌂ Menu','menu']]},
  chessrun:{msgs:['Wise. The London System shows no mercy 😌'],
    opts:[['⌂ Menu','menu']]},
  contact:{msgs:['Best move of the game 🤝'],card:`
    <div class="chead">📬 Reach Nour</div>
    <div class="cbody">Fastest: email. Formal: LinkedIn. Curious: website.</div>
    <div class="cfoot">
      <a class="cbtn" href="mailto:nouraldeentofi@gmail.com">✉ Email</a>
      <a class="cbtn ghost" href="https://www.linkedin.com/in/nour-aldeen-tofi-19b116240" target="_blank" rel="noopener">LinkedIn</a>
      <a class="cbtn ghost" href="https://nouraldeentofi.netlify.app" target="_blank" rel="noopener">Website</a>
    </div>`,
    msgs2:['Based in Riyadh 🇸🇦 · replies fast · faster if you mention anime.'],
    opts:[['⌂ Menu','menu'],['👋 That\'s all, thanks!','bye']]},
  bye:{msgs:['Thanks for talking to my portfolio instead of just scrolling one 😄','Yalla, see you in the inbox! 👋'],
    opts:[['⌂ Start over','menu']]},
  menu:{msgs:['What else can I tell you?'],opts:MENU}
};

let busy=false;
function showOpts(opts){
  replies.innerHTML='';
  opts.forEach(([label,next],i)=>{
    const b=document.createElement('button');b.className='qr';b.innerHTML=label;
    b.style.animationDelay=(i*.06)+'s';
    b.onclick=()=>{if(busy)return;pick(label,next);};
    replies.appendChild(b);
  });
}
function typeThen(fn,len){
  if(reduced){fn();return Promise.resolve();}
  return new Promise(res=>{
    typing.classList.add('on');thread.appendChild(typing);scrollDown();
    setTimeout(()=>{typing.classList.remove('on');fn();res();},Math.min(1500,420+len*9));
  });
}
async function runNode(key){
  busy=true;replies.innerHTML='';
  const n=NODES[key];
  for(const m of (n.msgs||[])){await typeThen(()=>addMsg(m,'bot'),m.length);}
  if(n.card){await typeThen(()=>addCard(n.card),80);}
  for(const m of (n.msgs2||[])){await typeThen(()=>addMsg(m,'bot'),m.length);}
  showOpts(n.opts||MENU);busy=false;
}
function pick(label,next){
  addMsg(label,'user');
  runNode(next);
}
runNode('start');
</script>
</body>
</html>
