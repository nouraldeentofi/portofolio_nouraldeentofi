<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nour Aldeen Tofi — GARDEN · Grow a Career</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--skyD:#bfe6f5;--skyN:#1c2547;--soil:#6b4a2e;--soild:#54371f;--leaf:#3f9a52;--fg:#2b3a2e;
        --card:#fffdf4;--accent:#e0673f;--nfg:#e8ecff}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Quicksand',sans-serif;min-height:100vh;color:var(--fg);overflow-x:hidden;
    background:linear-gradient(180deg,var(--skyD) 0%,#e8f6e8 70%,#d8ecd2);transition:background 1.2s}
  body.night{background:linear-gradient(180deg,var(--skyN) 0%,#2b3556 70%,#26314e);color:var(--nfg)}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--accent);color:#fff}

  header{text-align:center;padding:6vh 5vw 2vh;position:relative;z-index:5}
  h1{font-family:'Caveat',cursive;font-weight:700;font-size:clamp(40px,7.5vw,76px);line-height:1}
  h1 span{color:var(--accent)}
  .sub{font-size:13px;font-weight:600;opacity:.7;margin-top:8px;letter-spacing:.06em}
  #tools{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .tool{font-family:'Quicksand';font-weight:700;font-size:12.5px;border:2px solid currentColor;border-radius:99px;
    padding:11px 20px;cursor:pointer;background:rgba(255,255,255,.4);transition:transform .15s}
  body.night .tool{background:rgba(255,255,255,.08)}
  .tool:hover{transform:translateY(-2px)}
  #prog{font-weight:700;font-size:12px;padding:11px 18px;border-radius:99px;background:rgba(255,255,255,.55)}
  body.night #prog{background:rgba(255,255,255,.1)}

  /* sun / moon */
  #orb{position:fixed;top:7vh;right:9vw;width:74px;height:74px;border-radius:50%;z-index:1;
    background:radial-gradient(circle at 35% 30%,#fff6c9,#ffd23f 60%,#ffb03f);box-shadow:0 0 60px rgba(255,210,63,.7);transition:all 1.2s}
  body.night #orb{background:radial-gradient(circle at 35% 30%,#f2f4ff,#c9d1f0 60%,#98a4cf);box-shadow:0 0 50px rgba(201,209,240,.5)}
  .cloud{position:fixed;z-index:1;background:rgba(255,255,255,.8);border-radius:99px;filter:blur(2px);animation:drift linear infinite}
  body.night .cloud{background:rgba(255,255,255,.12)}
  @keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
  .star{position:fixed;background:#fff;border-radius:50%;z-index:1;opacity:0;transition:opacity 1s}
  body.night .star{opacity:.9;animation:tw 2.6s infinite}
  @keyframes tw{50%{opacity:.25}}

  /* garden bed */
  #bed{position:relative;margin:8vh auto 0;width:min(1050px,96vw);z-index:4}
  #plants{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;align-items:end;
    min-height:300px;padding:0 3vw}
  .plot{position:relative;text-align:center;cursor:pointer;padding-bottom:12px}
  .mound{width:74px;height:26px;margin:0 auto;background:radial-gradient(ellipse at 50% 0%,var(--soil),var(--soild));
    border-radius:50% 50% 8px 8px;position:relative}
  .mound::after{content:'⌄';position:absolute;left:50%;top:-22px;transform:translateX(-50%);opacity:.35;font-size:15px}
  .plot .hintlb{font-size:10px;font-weight:700;opacity:.55;margin-top:6px;letter-spacing:.04em}
  /* plant */
  .plant{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:8px;pointer-events:none}
  .stem{width:5px;margin:0 auto;background:linear-gradient(180deg,#5cb96b,var(--leaf));border-radius:4px;
    height:0;transition:height 1s cubic-bezier(.3,1.2,.4,1)}
  .head{position:absolute;left:50%;transform:translate(-50%,10px) scale(0);font-size:34px;transition:transform .7s cubic-bezier(.3,1.6,.4,1);
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  .leafL,.leafR{position:absolute;font-size:16px;opacity:0;transition:opacity .5s}
  .leafL{left:-14px}.leafR{right:-14px}
  .grown .hintlb{opacity:0}
  .lbl{position:absolute;left:50%;transform:translateX(-50%) rotate(-3deg);bottom:-6px;background:var(--card);color:#4a3a20;
    font-family:'Caveat',cursive;font-weight:700;font-size:15px;padding:2px 10px;border-radius:6px;
    box-shadow:0 3px 8px rgba(0,0,0,.18);opacity:0;transition:opacity .6s;white-space:nowrap;pointer-events:none}
  .grown .lbl{opacity:1}
  #ground{height:66px;background:linear-gradient(180deg,#7dbb6a,#5d9b4f 30%,var(--soil) 30.5%,var(--soild));
    border-radius:20px 20px 0 0;margin-top:-14px}
  body.night #ground{filter:brightness(.6)}

  /* butterflies */
  .bfly{position:fixed;z-index:6;font-size:18px;pointer-events:none}

  /* info card */
  #card{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);z-index:20;width:min(560px,92vw);
    background:var(--card);color:#3a2f1c;border-radius:18px;padding:26px 30px;box-shadow:0 30px 70px rgba(0,0,0,.3);
    transition:transform .5s cubic-bezier(.2,.9,.3,1.1)}
  #card.show{transform:translate(-50%,0)}
  #card .k{font-size:10.5px;font-weight:700;letter-spacing:.28em;color:var(--accent);text-transform:uppercase}
  #card h2{font-family:'Caveat',cursive;font-size:clamp(26px,4.4vw,38px);line-height:1;margin:6px 0 8px}
  #card p{font-size:13.5px;line-height:1.7;color:rgba(58,47,28,.8)}
  #card p b{color:#3a2f1c}
  #card .btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
  #card .btn{font-weight:700;font-size:11.5px;letter-spacing:.06em;padding:10px 18px;border-radius:99px;background:#3a2f1c;color:var(--card)}
  #card .btn.g{background:transparent;border:2px solid #3a2f1c;color:#3a2f1c}
  #cclose{position:absolute;top:10px;right:14px;border:none;background:#efe7d2;width:30px;height:30px;border-radius:50%;cursor:pointer;font-weight:700}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="orb"></div>

<header>
  <h1>Nour's <span>Career Garden</span></h1>
  <div class="sub">Every skill was planted, watered, and grown — click the soil mounds 🌱 · ازرع وشوف</div>
  <div id="tools">
    <button class="tool" id="plantAll">🌻 Plant everything</button>
    <button class="tool" id="dayNight">🌙 Night mode</button>
    <div id="prog">GROWN: <span id="pn">0</span>/10</div>
  </div>
</header>

<div id="bed"><div id="plants"></div><div id="ground"></div></div>

<div id="card"><button id="cclose">✕</button><div id="cc"></div></div>

<script>
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const PLANTS=[
 {e:'🌻',h:52,lb:'React',k:'Perennial · since 2023',t:'React',
  p:`The tallest thing in the garden. Planted at <b>Minicodeleader (2023)</b>, grown through Khwarizm, now shading the whole team at <b>Distinctive Frontier Co.</b> where Nour supervises frontend engineering.`},
 {e:'🌷',h:44,lb:'TypeScript',k:'Hardy · loves structure',t:'TypeScript',
  p:`Thrives in strict soil. Certified via <b>TypeScript in React (Coursera '25)</b>. Keeps every other plant from falling over.`},
 {e:'🌿',h:40,lb:'Tailwind',k:'Fast grower',t:'Tailwind CSS',
  p:`Utility-first ground cover — spreads fast, looks clean. <b>Tailwind From Scratch (Packt '24)</b>.`},
 {e:'🌼',h:42,lb:'JavaScript',k:'The original seed',t:'JavaScript',
  p:`Everything in this garden grew from this seed. Still blooming daily after ~3 years of professional sunlight.`},
 {e:'🌵',h:38,lb:'Python·AI',k:'Low water · high value',t:'Python & AI',
  p:`The resilient one: <b>IBM Python for DS & AI '24</b> + <b>IBM GenAI Prompt Engineering '24</b>. Survives any climate, powers the data side-quests.`},
 {e:'🌾',h:46,lb:'Coordination',k:'Field crop · feeds everyone',t:'Project Coordination',
  p:`A whole field of it: <b>freelance Project Coordinator at NexLead (2025→)</b> — requirements, user stories on Trello, releases. Harvest: <b>GoldenTag</b> on Google Play (inventory, barcode scanning, USD/SYP rates).`},
 {e:'🌳',h:56,lb:'Leadership',k:'Old growth · 2026',t:'Team Leadership',
  p:`The tree the garden gathers under. <b>Software Engineering Supervisor (Jan 2026 →)</b>: standards, architecture, backend alignment, shipped features. Google PM certs ×2 as fertilizer.`},
 {e:'🍀',h:34,lb:'ICPC luck',k:'Rare find · 2021',t:'ICPC / ACPC 2021',
  p:`Four-leaf algorithmic clover, found at the <b>ICPC/ACPC 2021</b>. Not luck actually — practice. The reflexes still bloom every code review.`},
 {e:'🌸',h:40,lb:'Education',k:'Root system · 2019–24',t:'B.Tech IT — Kalamoon',
  p:`The root network under everything: <b>University of Kalamoon, 2019–2024</b>. You can't see roots, but nothing stands without them.`},
 {e:'🌹',h:48,lb:'Hire me',k:'Cut flower · for you',t:'Your Project',
  p:`The one flower grown to be given away. Websites · React frontends · logos · cards · social visuals · coordination. <b>Riyadh · AR+EN</b> · off-garden: anime, chess, badminton, film.`,
  btns:[['✉ Email','mailto:nouraldeentofi@gmail.com'],['LinkedIn','https://www.linkedin.com/in/nour-aldeen-tofi-19b116240'],['Website','https://nouraldeentofi.netlify.app']]}
];

/* clouds + stars */
for(let i=0;i<4;i++){const c=document.createElement('div');c.className='cloud';
  c.style.cssText=`top:${6+i*9}vh;width:${90+Math.random()*120}px;height:${26+Math.random()*18}px;
  animation-duration:${60+i*30}s;animation-delay:-${Math.random()*60}s`;document.body.appendChild(c);}
for(let i=0;i<40;i++){const s=document.createElement('div');s.className='star';
  const z=Math.random()*2+1;
  s.style.cssText=`width:${z}px;height:${z}px;left:${Math.random()*100}vw;top:${Math.random()*45}vh;animation-delay:${Math.random()*3}s`;
  document.body.appendChild(s);}

/* audio */
let AC=null;
function ping(f,v){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(v||.05,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.35);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.4);}catch(e){}}

/* build plots */
const plantsEl=document.getElementById('plants');
let grown=0;
PLANTS.forEach((pl,i)=>{
  const plot=document.createElement('div');plot.className='plot';
  plot.innerHTML=`
    <div class="plant">
      <div class="head">${pl.e}</div>
      <span class="leafL">🍃</span><span class="leafR">🍃</span>
      <div class="stem"></div>
    </div>
    <div class="mound"></div>
    <div class="hintlb">plant ${pl.lb}</div>
    <div class="lbl">${pl.lb}</div>`;
  plantsEl.appendChild(plot);
  let state=0; /* 0 empty, 1 growing, 2 grown */
  function grow(){
    if(state>0){if(state===2)openCard(pl);return;}
    state=1;
    ping(320+i*40,.05);
    const stem=plot.querySelector('.stem'),head=plot.querySelector('.head');
    stem.style.height=(pl.h*3)+'px';
    setTimeout(()=>{
      head.style.bottom=(pl.h*3-6)+'px';
      head.style.transform='translate(-50%,0) scale(1)';
      plot.querySelector('.leafL').style.cssText+=`bottom:${pl.h*1.6}px;opacity:.9`;
      plot.querySelector('.leafR').style.cssText+=`bottom:${pl.h*2.1}px;opacity:.9`;
      plot.classList.add('grown');
      state=2;grown++;
      document.getElementById('pn').textContent=grown;
      ping(620+i*40,.06);
      if(grown===PLANTS.length)setTimeout(()=>openCard(PLANTS[9]),700);
    },reduced?0:800);
  }
  plot.addEventListener('click',grow);
  plot._grow=grow;
});
document.getElementById('plantAll').onclick=()=>{
  [...document.querySelectorAll('.plot')].forEach((p,i)=>setTimeout(()=>p._grow(),i*(reduced?0:260)));
};

/* day / night */
document.getElementById('dayNight').onclick=e=>{
  document.body.classList.toggle('night');
  e.target.textContent=document.body.classList.contains('night')?'☀️ Day mode':'🌙 Night mode';
};

/* butterflies */
if(!reduced){
  for(let i=0;i<3;i++){
    const b=document.createElement('div');b.className='bfly';b.textContent=i%2?'🦋':'🐝';
    document.body.appendChild(b);
    let a=Math.random()*7;
    (function fly(){
      a+=.017+i*.004;
      b.style.left=(50+Math.sin(a)*36+Math.sin(a*2.4)*7)+'vw';
      b.style.top=(46+Math.cos(a*1.3)*17)+'vh';
      b.style.transform=`rotate(${Math.sin(a*3)*22}deg)`;
      requestAnimationFrame(fly);
    })();
  }
}

/* info card */
const card=document.getElementById('card');
function openCard(pl){
  let btns='';
  (pl.btns||[]).forEach(([lb,href],j)=>{
    btns+=`<a class="btn${j?' g':''}" href="${href}"${href.startsWith('http')?' target="_blank" rel="noopener"':''}>${lb}</a>`;});
  document.getElementById('cc').innerHTML=`
    <div class="k">${pl.k}</div><h2>${pl.e} ${pl.t}</h2><p>${pl.p}</p>
    ${btns?'<div class="btns">'+btns+'</div>':''}`;
  card.classList.add('show');
}
document.getElementById('cclose').onclick=()=>card.classList.remove('show');
addEventListener('keydown',e=>{if(e.key==='Escape')card.classList.remove('show');});
</script>
</body>
</html>
