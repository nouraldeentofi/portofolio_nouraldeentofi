<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nour Aldeen Tofi — PHONE · Swipe to Meet Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--room:#14161c;--body:#1c1f27;--screen:#0b0d13;--fg:#f2f4f8;--dim:rgba(242,244,248,.6);--acc:#5eb8ff;--green:#3ddc84}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Figtree',sans-serif;background:radial-gradient(80vw 60vh at 50% 0%,#1e2230,var(--room));
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:4vh 4vw 6vh;color:var(--fg)}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--acc);color:#0b0d13}
  h1{font-weight:800;font-size:clamp(20px,3.8vw,30px)}
  h1 span{color:var(--acc)}
  .sub{font-size:11px;letter-spacing:.24em;color:var(--dim);margin:8px 0 22px;text-transform:uppercase;text-align:center}

  #phone{width:min(370px,94vw);aspect-ratio:9/18.6;background:var(--body);border-radius:44px;padding:12px;
    box-shadow:0 40px 90px rgba(0,0,0,.6), inset 0 0 0 2px #2c3040;position:relative}
  #screen{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:var(--screen)}
  #notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:90px;height:24px;border-radius:14px;
    background:#000;z-index:50}
  .view{position:absolute;inset:0;display:none;flex-direction:column}
  .view.on{display:flex}

  /* status bar */
  .status{display:flex;justify-content:space-between;padding:14px 22px 6px;font-size:11px;font-weight:600;z-index:5}

  /* LOCK */
  #lock{background:linear-gradient(180deg,#24406e,#101a30 70%);cursor:grab}
  #lock:active{cursor:grabbing}
  #clock{text-align:center;margin-top:44px}
  #clock .t{font-size:56px;font-weight:800;letter-spacing:-.02em}
  #clock .d{font-size:13px;color:var(--dim);margin-top:2px}
  #notifs{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:9px}
  .notif{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border-radius:16px;padding:11px 14px;
    animation:nin .5s both}
  @keyframes nin{from{opacity:0;transform:translateY(-14px)}to{opacity:1}}
  .notif .nh{display:flex;gap:8px;align-items:center;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .notif .nb{font-size:12px;line-height:1.45;margin-top:4px}
  .notif .nb b{font-weight:800}
  #swipeHint{text-align:center;padding:12px 0 20px;font-size:11px;letter-spacing:.2em;color:var(--dim);
    text-transform:uppercase;animation:hb 2s infinite}
  @keyframes hb{0%,100%{opacity:.4}50%{opacity:1}}

  /* HOME */
  #home{background:linear-gradient(180deg,#182036,#0e1322 70%)}
  #apps{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;align-content:start;padding:26px 18px}
  .app{border:none;background:none;color:var(--fg);cursor:pointer;text-align:center;font-family:'Figtree'}
  .app .ic{width:56px;height:56px;margin:0 auto;border-radius:15px;display:flex;align-items:center;justify-content:center;
    font-size:26px;box-shadow:0 6px 14px rgba(0,0,0,.35);transition:transform .15s}
  .app:hover .ic{transform:scale(1.08)}
  .app .lb{font-size:10px;margin-top:6px;color:var(--dim)}
  .badge{position:absolute;margin-left:38px;margin-top:-4px;background:#ff4d4d;color:#fff;font-size:9px;font-weight:800;
    min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center}
  #dock{display:flex;justify-content:space-around;background:rgba(255,255,255,.08);margin:0 12px 14px;
    padding:10px;border-radius:24px;backdrop-filter:blur(8px)}

  /* APP VIEW */
  #appview{background:#0e1322}
  #appbar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
  #backB{border:none;background:rgba(255,255,255,.1);color:var(--fg);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px}
  #appTitle{font-weight:800;font-size:15px}
  #appBody{flex:1;overflow-y:auto;padding:16px}
  #appBody h3{font-size:16px;font-weight:800;margin-bottom:8px}
  #appBody p{font-size:12.5px;line-height:1.65;color:var(--dim)}
  #appBody p b{color:var(--fg)}
  .bubble{background:#1c2333;border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:12.5px;line-height:1.55}
  .bubble .bh{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
  .bubble b{color:var(--fg)}
  .abtn{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;background:var(--acc);color:#0b0d13;
    padding:10px 16px;border-radius:99px;margin:4px 6px 2px 0}
  .abtn.g{background:transparent;border:1.5px solid var(--acc);color:var(--acc)}
  .track{display:flex;align-items:center;gap:10px;background:#1c2333;border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .track .ta{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px}
  .track .tt{font-size:12px;font-weight:600}
  .track .ts{font-size:10px;color:var(--dim)}
  .track .tp{margin-left:auto;font-size:14px}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<h1>NOUR<span>PHONE</span> 26 PRO</h1>
<div class="sub">His actual life, as a phone · swipe up to unlock · اسحب لفوق</div>

<div id="phone"><div id="screen">
  <div id="notch"></div>

  <!-- LOCK -->
  <div class="view on" id="lock">
    <div class="status"><span id="stTime1">9:41</span><span>الرياض ▾ 5G ▮▮▮</span></div>
    <div id="clock"><div class="t" id="bigTime">9:41</div><div class="d" id="bigDate">Riyadh, Saudi Arabia</div></div>
    <div id="notifs"></div>
    <div id="swipeHint">▲ SWIPE UP (OR CLICK) TO UNLOCK ▲</div>
  </div>

  <!-- HOME -->
  <div class="view" id="home">
    <div class="status"><span id="stTime2">9:41</span><span>5G ▮▮▮ 🔋96%</span></div>
    <div id="apps"></div>
    <div id="dock"></div>
  </div>

  <!-- APP -->
  <div class="view" id="appview">
    <div class="status"><span id="stTime3">9:41</span><span>5G ▮▮▮</span></div>
    <div id="appbar"><button id="backB">←</button><div id="appTitle">App</div></div>
    <div id="appBody"></div>
  </div>
</div></div>

<script>
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
/* clock */
function clock(){const d=new Date();
  const t=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  ['stTime1','stTime2','stTime3','bigTime'].forEach(id=>document.getElementById(id).textContent=t);
  document.getElementById('bigDate').textContent=
    d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})+' · Riyadh';}
clock();setInterval(clock,20000);

/* notifications */
const NOTIFS=[
 ['💼','WORK · NOW','<b>Distinctive Frontier Co.</b> — Reminder: you are the Software Engineering Supervisor (Jan 2026 →). Standards meeting at 11.'],
 ['🧭','NEXLEAD · FREELANCE','Client approved the user stories ✅ — coordination since Mar 2025. Trello board updated.'],
 ['💍','GOOGLE PLAY','<b>GoldenTag</b> is live! Inventory · barcode scanning · USD/SYP rates. Nice ship, coordinator.'],
 ['🎓','MEMORIES · 2024','On this day: graduated <b>B.Tech IT, University of Kalamoon</b> (2019–2024).'],
 ['⚔️','ICPC THROWBACK','2021: competitive programming finals. Your reflexes still remember.'],
 ['🏸','HEALTH','Badminton streak: alive. Chess rating: rising. Anime backlog: infinite.'],
 ['⭐','HIRE ME','Someone is viewing your portfolio right now… oh wait, that\'s you. <b>Tap Mail to say hi.</b>']
];
const nf=document.getElementById('notifs');
NOTIFS.forEach((n,i)=>{
  const d=document.createElement('div');d.className='notif';d.style.animationDelay=(i*.35)+'s';
  d.innerHTML=`<div class="nh"><span>${n[0]}</span><span>${n[1]}</span></div><div class="nb">${n[2]}</div>`;
  nf.appendChild(d);
});

/* audio */
let AC=null;
function blip(f){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f||700;
  g.gain.setValueAtTime(.05,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.12);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.14);}catch(e){}}

/* views */
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById(id).classList.add('on');}
/* unlock: swipe up or click */
let ty0=null;
const lock=document.getElementById('lock');
lock.addEventListener('pointerdown',e=>ty0=e.clientY);
lock.addEventListener('pointerup',e=>{
  if(ty0===null)return;
  if(ty0-e.clientY>40||Math.abs(ty0-e.clientY)<8){blip(880);show('home');}
  ty0=null;
});

/* apps */
const APPS=[
 {ic:'✉️',bg:'linear-gradient(160deg,#5eb8ff,#2e6fb8)',lb:'Mail',badge:1,t:'Mail — Inbox (1)',
  b:`<div class="bubble"><div class="bh">To: nouraldeentofi@gmail.com</div><b>Subject: Let's work together</b><br><br>Hi Nour — I saw the 50-portfolio gallery. We need to talk.<br><br><a class="abtn" href="mailto:nouraldeentofi@gmail.com">Send this email for real ↗</a></div>
     <div class="bubble"><div class="bh">Meta · 2025</div>Your certificate: <b>Advanced React</b> ✓</div>
     <div class="bubble"><div class="bh">Google · 2025</div>Certificates: <b>Foundations of PM</b> + <b>Project Initiation</b> ✓</div>
     <div class="bubble"><div class="bh">IBM · 2024</div><b>Python for DS & AI</b> + <b>GenAI Prompt Engineering</b> ✓</div>`},
 {ic:'💼',bg:'linear-gradient(160deg,#59d97d,#2b8a4c)',lb:'Career',t:'Career.app',
  b:`<div class="bubble"><div class="bh">2026 → · Current</div><b>Software Engineering Supervisor</b> — Distinctive Frontier Co., Riyadh. Leads frontend: React systems, standards, backend alignment, shipped features.</div>
     <div class="bubble"><div class="bh">2025 → · Parallel</div><b>Project Coordinator (freelance)</b> — NexLead, remote. Requirements → user stories → releases.</div>
     <div class="bubble"><div class="bh">2025</div><b>Frontend + Coordination</b> — Distinctive Frontier Co.</div>
     <div class="bubble"><div class="bh">2024–25</div><b>Frontend Developer</b> — Khwarizm Technologies, Riyadh.</div>
     <div class="bubble"><div class="bh">2023–24</div><b>React Developer</b> — Minicodeleader.</div>`},
 {ic:'🗺️',bg:'linear-gradient(160deg,#ffb54d,#c9822e)',lb:'Maps',t:'Maps — Saved Places',
  b:`<div class="bubble">📍 <b>Riyadh, Saudi Arabia</b> — Home & current base.</div>
     <div class="bubble">🏫 <b>University of Kalamoon</b> — B.Tech IT, 2019–2024. ★★★★★ "would learn again"</div>
     <div class="bubble">🏢 <b>Distinctive Frontier Co.</b> — 22 min commute. Frequently visited (daily).</div>
     <div class="bubble">🌐 <b>NexLead</b> — 0 min commute (remote). Favorite route.</div>`},
 {ic:'🎵',bg:'linear-gradient(160deg,#f0abfc,#a855f7)',lb:'Music',t:'Music — "Coding Mode" Playlist',
  b:`<div class="track"><div class="ta" style="background:#2b3860">⚛</div><div><div class="tt">React State of Mind</div><div class="ts">The Components · 3:42</div></div><div class="tp">▶</div></div>
     <div class="track"><div class="ta" style="background:#1d4d3b">🌿</div><div><div class="tt">Utility First (Tailwind Remix)</div><div class="ts">DJ Classname · 2:58</div></div><div class="tp">▶</div></div>
     <div class="track"><div class="ta" style="background:#5e2333">🎻</div><div><div class="tt">Strict Mode Sonata</div><div class="ts">TypeScript Philharmonic · 4:15</div></div><div class="tp">▶</div></div>
     <div class="track"><div class="ta" style="background:#6e4526">🥁</div><div><div class="tt">Merge Conflict Blues</div><div class="ts">Git & The Branches · 3:03</div></div><div class="tp">▶</div></div>`},
 {ic:'♟️',bg:'linear-gradient(160deg,#e8dccf,#8a6a45)',lb:'Chess',t:'Chess.app',
  b:`<h3>Daily puzzle: solved ✓</h3><p>Favorite opening: <b>the London System</b>. Career equivalent: solid setup, no gambits, wins the endgame. ICPC 2021 background means he calculates fast and doesn't blunder under time pressure.</p>`},
 {ic:'📺',bg:'linear-gradient(160deg,#ff6a5e,#b33226)',lb:'Anime',t:'AnimeList',
  b:`<h3>Currently watching: everything</h3><p>Anime taught him long-arc storytelling — useful when a project spans 12 sprints. Also on rotation: films, series, and badminton matches (playing, not just watching 🏸).</p>`},
 {ic:'🛠️',bg:'linear-gradient(160deg,#7dd3fc,#2e86b8)',lb:'Stack',t:'Stack — Installed',
  b:`<div class="bubble"><b>Core:</b> React · TypeScript · Tailwind CSS · JavaScript</div>
     <div class="bubble"><b>Also:</b> Python (DS/AI) · Git · Jira · Trello · Prompt Engineering · Clean Code</div>
     <div class="bubble"><b>Languages:</b> Arabic (native) · English (fluent)</div>`},
 {ic:'⭐',bg:'linear-gradient(160deg,#ffd23f,#c9962e)',lb:'Hire Me',t:'Hire Me — Services',
  b:`<h3>Open for projects</h3><p>Websites · React frontends · logos · business cards · social media visuals · remote project coordination.</p><p style="margin-top:10px">
     <a class="abtn" href="mailto:nouraldeentofi@gmail.com">✉ Email</a>
     <a class="abtn g" href="https://www.linkedin.com/in/nour-aldeen-tofi-19b116240" target="_blank" rel="noopener">LinkedIn</a>
     <a class="abtn g" href="https://nouraldeentofi.netlify.app" target="_blank" rel="noopener">Website</a></p>`}
];
const appsEl=document.getElementById('apps'),dock=document.getElementById('dock');
APPS.forEach((a,i)=>{
  const b=document.createElement('button');b.className='app';
  b.innerHTML=`${a.badge?'<span class="badge">'+a.badge+'</span>':''}<div class="ic" style="background:${a.bg}">${a.ic}</div><div class="lb">${a.lb}</div>`;
  b.onclick=()=>{blip(600+i*40);openApp(i);};
  (i<4?appsEl:i<8?appsEl:dock).appendChild(b);
});
/* dock: shortcuts */
[['📞','tel'],['✉️',0],['🌐','web'],['🔒','lock']].forEach(([ic,act])=>{
  const b=document.createElement('button');b.className='app';
  b.innerHTML=`<div class="ic" style="background:rgba(255,255,255,.14)">${ic}</div>`;
  b.onclick=()=>{blip(500);
    if(act==='lock')show('lock');
    else if(act==='web')window.open('https://nouraldeentofi.netlify.app','_blank');
    else if(act==='tel')openApp(7);
    else openApp(act);};
  dock.appendChild(b);
});
function openApp(i){
  document.getElementById('appTitle').textContent=APPS[i].t;
  document.getElementById('appBody').innerHTML=APPS[i].b;
  show('appview');
}
document.getElementById('backB').onclick=()=>{blip(440);show('home');};
addEventListener('keydown',e=>{if(e.key==='Escape')show('home');});
</script>
</body>
</html>
